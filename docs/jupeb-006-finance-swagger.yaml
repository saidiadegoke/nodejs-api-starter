openapi: 3.0.0
info:
  title: 'JUPEB 006 — Finance'
  version: '1.0.0'
  description: |
    Links JUPEB registrations to `payments` and finance reporting (`docs/006-jupeb-finance-technical-design.md`).
    Base path: **`/finance`**.

    Core payments API remains under **`/payments`** (see Payments Swagger).

servers:
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }

tags:
  - name: Finance — student
  - name: Finance — institution
  - name: Finance — admin

paths:
  /finance/me/checkout:
    post:
      tags: [Finance — student]
      summary: Create payment intent linked to current (claimed) registration
      description: |
        Uses `payments` with `registration_id` set. Blocks duplicate pending intents per registration.
        Session must be open.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  exclusiveMinimum: 0
                currency:
                  type: string
                  default: NGN
                registration_id:
                  type: string
                  format: uuid
                  description: Defaults to latest claimed registration for user
                payment_method:
                  type: string
      responses:
        '201': { description: Payment row in response data }
        '409': { description: Unpaid intent already exists }
        '422': { description: Session closed or validation error }

  /finance/me/payments:
    get:
      tags: [Finance — student]
      summary: List payments linked to my registrations
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Paginated; rows include jupeb_projection }

  /finance/institution/overview:
    get:
      tags: [Finance — institution]
      summary: Institution payment dashboard KPI cards
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: university_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Overview with growth cards vs previous session }

  /finance/institution/fees:
    get:
      tags: [Finance — institution]
      summary: Affiliation or examination fee summary for one payment item
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: university_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          required: true
          schema: { type: string, example: affiliation_fee }
      responses:
        '200': { description: total_expected / paid / outstanding cards }

  /finance/institution/fee-preview:
    get:
      tags: [Finance — institution]
      summary: Outstanding balance before institution checkout
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: full_fee, already_paid, outstanding }

  /finance/institution/checkout:
    post:
      tags: [Finance — institution]
      summary: Start institution-scoped payment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method, payment_item, payment_structure, amount]
              properties:
                session_id: { type: string, format: uuid }
                university_id: { type: string, format: uuid }
                payment_method: { type: string }
                payment_item: { type: string }
                payment_structure: { type: string }
                amount: { type: number }
                description: { type: string, maxLength: 250 }
      responses:
        '201': { description: Payment intent created }

  /finance/institution/payments:
    get:
      tags: [Finance — institution]
      summary: Paginated institution payment history
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Paginated payment rows }

  /finance/institution/payments/{paymentId}/receipt:
    get:
      tags: [Finance — institution]
      summary: Institution-scoped transaction receipt
      security:
        - BearerAuth: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Receipt composite }

  /finance/payments:
    get:
      tags: [Finance — admin]
      summary: List payments that have `registration_id` (optional session filter)
      description: Roles `financial_admin`, `registrar`, `admin`, `super_admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Paginated }
        '403': { description: Forbidden }

  /finance/fees:
    get:
      tags: [Finance — admin]
      summary: Per-institution fee KPI cards (query param variant)
      description: |
        Three metric cards for an institution fee tab: total expected, paid,
        and outstanding. Requires `university_id` + `payment_item`
        (`affiliation_fee` or `examination_fee`). Omits `session_id` to use the
        caller's effective viewing session.
      security:
        - BearerAuth: []
      parameters:
        - name: university_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          required: true
          schema: { type: string, example: examination_fee }
      responses:
        '200':
          description: |
            `total_expected_payment`, `fee_paid`, `outstanding_fees` growth cards
            (aliases of `total_expected`, `paid`, `outstanding`).

  /finance/overview:
    get:
      tags: [Finance — admin]
      summary: Foundation finance portal KPI cards
      description: |
        Aggregates all institutions in a session. Returns projected and collected
        affiliation/examination totals with growth vs the previous session.
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Overview KPI object in response data }

  /finance/analytics/exam-fee-by-institution:
    get:
      tags: [Finance — admin]
      summary: Exam fee bar chart — projected vs collected examination fee per institution
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, maximum: 100 }
      responses:
        '200': { description: Institutions ordered by projected exam fee descending }

  /finance/analytics/payment-trends:
    get:
      tags: [Finance — admin]
      summary: Monthly collected payment totals (registration + institution checkout)
      security:
        - BearerAuth: []
      parameters:
        - name: year
          in: query
          schema: { type: integer }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Current + previous year monthly series }

  /finance/analytics/institution-fee-records:
    get:
      tags: [Finance — admin]
      summary: Paginated per-institution fee records table
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Paginated rows with jupeb_prefix, email, status }

  /finance/analytics/institutions/{universityId}/fees:
    get:
      tags: [Finance — admin]
      summary: Per-institution fee KPI cards (path param variant)
      description: |
        Same payload as `GET /finance/fees` — powers the three header cards on
        the institution payment detail page (Affiliation / Examination tabs).
      security:
        - BearerAuth: []
      parameters:
        - name: universityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          required: true
          schema: { type: string, example: examination_fee }
      responses:
        '200': { description: Fee KPI cards for the institution }

  /finance/analytics/institutions/{universityId}/payments:
    get:
      tags: [Finance — admin]
      summary: Institution payment history for foundation admin (eye-icon drawer)
      security:
        - BearerAuth: []
      parameters:
        - name: universityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: payment_item
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Paginated payment rows }

  /finance/registrations/{registrationId}/payment-summary:
    get:
      tags: [Finance — admin]
      summary: Per-registration payment aggregates
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200': { description: Payments list and totals aggregate }

  /finance/registrations/{registrationId}/reconcile:
    post:
      tags: [Finance — admin]
      summary: Record manual reconciliation audit row
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id, status_snapshot, captured_amount, currency]
              properties:
                payment_id: { type: string, format: uuid }
                status_snapshot:
                  type: string
                  enum: [pending, successful, failed, refunded]
                captured_amount: { type: number }
                currency: { type: string }
                gateway_reference: { type: string }
      responses:
        '201': { description: Reconciliation row in response data }

  /finance/reports/session/{sessionId}:
    get:
      tags: [Finance — admin]
      summary: Session-level paid/unpaid style aggregates
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: Report object in response data }

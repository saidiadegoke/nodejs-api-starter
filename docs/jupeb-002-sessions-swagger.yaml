openapi: 3.0.0
info:
  title: 'JUPEB 002 — Registration sessions'
  version: '1.2.0'
  description: |
    Academic-year registration windows, fees, cutoff dates, and lifecycle
    (`docs/002-jupeb-sessions-technical-design.md`). Base path: **`/sessions`**.

    Migration 015 added cutoff/fee fields and `max_ca_score` to support the figma
    "Create New Session" modal.

    `POST /sessions/{sessionId}/finalize-candidate-numbers` assigns final JUPEB
    candidate numbers (session must be closed).

servers:
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Session:
      type: object
      properties:
        id: { type: string, format: uuid }
        academic_year: { type: string, example: '2026/2027' }
        year_short: { type: string, example: '27' }
        status: { type: string, enum: [open, closed] }
        registration_locked:
          type: boolean
          description: When true, institutions cannot enroll/issue new candidate codes.
        opens_at: { type: string, format: date-time }
        closes_at: { type: string, format: date-time }
        student_submission_deadline: { type: string, format: date-time, nullable: true }
        institution_approval_deadline: { type: string, format: date-time, nullable: true }
        candidate_info_cutoff_at: { type: string, format: date-time, nullable: true }
        profile_update_cutoff_at: { type: string, format: date-time, nullable: true }
        ca_cutoff_at: { type: string, format: date-time, nullable: true }
        max_ca_score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        affiliation_fee_existing: { type: number, nullable: true, minimum: 0 }
        affiliation_fee_new: { type: number, nullable: true, minimum: 0 }
        exam_fee_per_candidate: { type: number, nullable: true, minimum: 0 }
        registration_fee_amount: { type: number, nullable: true, minimum: 0 }
        registration_fee_currency: { type: string, example: 'NGN' }
        notes: { type: string, nullable: true, description: 'Aliased as `description` on input.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SessionStatsDelta:
      type: object
      properties:
        value: { type: number }
        previous: { type: number }
        delta_pct:
          type: number
          nullable: true
          description: '`null` when previous is 0 and current is non-zero.'
        direction:
          type: string
          enum: [up, down, flat]
    SessionStats:
      type: object
      properties:
        session_id: { type: string, format: uuid }
        total_registrations: { type: integer }
        registrations_by_status: { type: object, additionalProperties: { type: integer } }
        institutions_count: { type: integer }
        subject_combinations_count: { type: integer }
        candidates_with_biometrics: { type: integer }
        candidates_without_biometrics: { type: integer }
        previous_session_id:
          type: string
          format: uuid
          nullable: true
          description: Present when ?previous_session_id is supplied.
        deltas:
          type: object
          description: Present when ?previous_session_id is supplied.
          additionalProperties: { $ref: '#/components/schemas/SessionStatsDelta' }
    SessionContextSummary:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: '2026/2027' }
        status: { type: string, enum: [open, closed] }
        opens_at: { type: string, format: date-time, nullable: true }
        closes_at: { type: string, format: date-time, nullable: true }
    SessionContext:
      type: object
      properties:
        active_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: Global open session (null if none).
        viewing_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: User viewing preference (null when unset).
        effective_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: Resolved read scope when session_id is omitted.
    SessionMetrics:
      type: object
      properties:
        exams:
          type: integer
          nullable: true
          description: Reserved for future examination scheduling; currently null.
        institutions:
          type: integer
          description: Distinct universities with registrations in the session.
        total_candidates:
          type: integer
          description: All registrations in the session (includes withdrawn).
        current_candidates_enrolled:
          type: integer
          description: Approved registrations in the session.
        candidates_with_biometrics:
          type: integer
          description: Non-withdrawn registrations with at least one active biometric capture.
    SessionMetricsResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/SessionContextSummary'
          nullable: true
        metrics:
          $ref: '#/components/schemas/SessionMetrics'
        compared_to:
          type: object
          nullable: true
          properties:
            session_id: { type: string, format: uuid }
            label: { type: string }
        deltas:
          type: object
          nullable: true
          additionalProperties: { $ref: '#/components/schemas/SessionStatsDelta' }

tags:
  - name: Sessions
    description: |
      Authenticated reads; writes require `registrar`/`admin`/`super_admin`
      (reopen is `super_admin` only).

paths:
  /sessions:
    get:
      tags: [Sessions]
      summary: List sessions (paginated, with text search)
      description: |
        Paginated list. `q` is a case-insensitive ILIKE substring match
        across `academic_year` and `year_short` — powers the search
        box on the Session History tab.
      security:
        - BearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - name: q
          in: query
          description: 'Case-insensitive substring match across academic_year / year_short.'
          schema: { type: string, example: '2025/' }
      responses:
        '200': { description: Paginated `Session` rows }
        '401': { description: Unauthorized }
    post:
      tags: [Sessions]
      summary: Create session (open)
      description: |
        New sessions are created with `status='open'`. Creating a new session
        closes any previously open session so there is only one active session.
        Cutoff dates are validated to be in chronological order:
        `closes_at ≤ candidate_info_cutoff_at ≤ profile_update_cutoff_at ≤ ca_cutoff_at`.
        `description` is accepted as an alias for `notes`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_year, year_short, opens_at, closes_at]
              properties:
                academic_year: { type: string, example: '2026/2027' }
                year_short: { type: string, example: '27' }
                opens_at: { type: string, format: date-time }
                closes_at: { type: string, format: date-time }
                student_submission_deadline: { type: string, format: date-time }
                institution_approval_deadline: { type: string, format: date-time }
                candidate_info_cutoff_at: { type: string, format: date-time }
                profile_update_cutoff_at: { type: string, format: date-time }
                ca_cutoff_at: { type: string, format: date-time }
                max_ca_score: { type: integer, minimum: 0, maximum: 100 }
                affiliation_fee_existing: { type: number, minimum: 0 }
                affiliation_fee_new: { type: number, minimum: 0 }
                exam_fee_per_candidate: { type: number, minimum: 0 }
                registration_fee_amount: { type: number, minimum: 0 }
                registration_fee_currency: { type: string, default: 'NGN', minLength: 3, maxLength: 3 }
                notes: { type: string }
                description: { type: string, description: Alias for `notes`. }
      responses:
        '201':
          description: Created `Session`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Session' }
        '409': { description: Duplicate academic_year }
        '422': { description: Validation error (cutoff order, max_ca_score range, etc.) }

  /sessions/export:
    get:
      tags: [Sessions]
      summary: Export sessions as CSV
      description: |
        Streams a CSV with columns `id, academic_year, year_short, status, opens_at,
        closes_at, candidate_info_cutoff_at, profile_update_cutoff_at, ca_cutoff_at,
        max_ca_score, affiliation_fee_existing, affiliation_fee_new,
        exam_fee_per_candidate, registration_fee_amount, registration_fee_currency,
        created_at`. Admin/registrar/super_admin only.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema: { type: string }
        '403': { description: Forbidden }

  /sessions/context:
    get:
      tags: [Sessions]
      summary: Active, viewing, and effective session context
      description: |
        Returns three session concepts for the authenticated user:
        `active_session` is the global `status=open` session;
        `viewing_session` is the per-user read preference (or null);
        `effective_session` is what read APIs use when `session_id` is omitted
        (`viewing_session ?? active_session`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionContext' }
        '401': { description: Unauthorized }

  /sessions/metrics:
    get:
      tags: [Sessions]
      summary: Session History KPI cards (effective session)
      description: |
        Returns the five header metrics on the Session History page for the
        caller's **effective** viewing session. Omit `session_id` to use the
        per-user Switch preference (or global open session). Pass `session_id`
        for a one-off override.
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
          description: Optional override; otherwise uses effective viewing session.
        - name: previous_session_id
          in: query
          schema: { type: string, format: uuid }
          description: When set, response includes `compared_to` and per-metric `deltas`.
      responses:
        '200':
          description: Session-scoped KPI cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionMetricsResponse' }
        '401': { description: Unauthorized }
        '404': { description: Session not found (explicit session_id) }
        '422': { description: Invalid UUID }

  /sessions/viewing:
    put:
      tags: [Sessions]
      summary: Set per-user viewing session (Switch)
      description: |
        Persists a read-only viewing preference. Does **not** open or close
        the global session — use `POST /sessions/{sessionId}/open` for that.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string, format: uuid }
      responses:
        '200':
          description: Updated context (`SessionContext`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionContext' }
        '404': { description: Session not found }
        '422': { description: Invalid session_id }
    delete:
      tags: [Sessions]
      summary: Clear viewing session (use active session for reads)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Context after reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionContext' }

  /sessions/{sessionId}:
    get:
      tags: [Sessions]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: 'Session row in response data' }
        '404': { description: Not found }
    patch:
      tags: [Sessions]
      summary: Patch session (rules depend on status)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Updated `Session` }

  /sessions/{sessionId}/stats:
    get:
      tags: [Sessions]
      summary: Session KPIs (with optional period-over-period delta)
      description: |
        Returns registration totals plus institution count, subject-combination count,
        and biometric coverage. When `previous_session_id` is supplied, response
        includes a `deltas` block for each metric.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: previous_session_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: KPIs and (optionally) deltas
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionStats' }

  /sessions/{sessionId}/open:
    post:
      tags: [Sessions]
      summary: Open a closed session (only one open session globally)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200': { description: OK }
        '409': { description: Another session already open }

  /sessions/{sessionId}/close:
    post:
      tags: [Sessions]
      summary: Transition open → closed
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses: { '200': { description: OK } }

  /sessions/{sessionId}/registration-lock:
    patch:
      tags: [Sessions]
      summary: Lock or unlock institution registration for a session
      description: |
        Toggles whether institutions can enroll/issue new candidate codes for
        this session. This is independent of the session `open` / `closed`
        lifecycle; an open session can still have registration locked.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locked]
              properties:
                locked: { type: boolean }
      responses:
        '200': { description: Updated session }
        '422': { description: locked must be boolean }

  /sessions/{sessionId}/reopen:
    post:
      tags: [Sessions]
      summary: Reopen a closed session (super_admin only)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses: { '200': { description: OK } }

  /sessions/{sessionId}/finalize-candidate-numbers:
    post:
      tags: [Sessions]
      summary: Assign final JUPEB candidate numbers (session must be closed)
      description: |
        Idempotent batch update for approved registrations without
        `jupeb_candidate_number`. See also JUPEB 005 and
        `GET /registration/sessions/{sessionId}/numbering-preview`.

        **Side effect:** for every row a matric is assigned to, a
        `jupeb-matric-assigned.html` email is dispatched to the
        candidate (fire-and-forget). The email's subject embeds the
        new matric, and the body restates the matric-lockdown rule so
        students aren't surprised when their email / phone / reg-code
        login stops working.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: |
            Response data includes `session_id`, `assigned`, `skipped`, `numbers[]`.
        '422': { description: Session not closed }

  /sessions/finalize-all-closed:
    post:
      tags: [Sessions]
      summary: Bulk finalize across every closed session
      description: |
        Walks every session with `status='closed'` that still has
        approved registrations awaiting matric assignment and runs
        `finalize-candidate-numbers` against each. Per-session
        failures are captured (`error` field in the result) without
        aborting the bulk run.

        **Auth:** admin / super_admin / registrar.

        **Optimization:** the endpoint only walks sessions with
        eligible rows — a clean DB returns in milliseconds.

        **Idempotency:** safe to re-run. The second invocation
        reports `totals.assigned: 0` because per-row updates use
        `setCandidateNumberIfNull`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregated bulk-finalize result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            session_id: { type: string, format: uuid }
                            academic_year: { type: string }
                            year_short: { type: string }
                            assigned: { type: integer }
                            skipped: { type: integer }
                            error:
                              type: string
                              description: Present only when finalize failed for this row.
                      totals:
                        type: object
                        properties:
                          sessions_processed: { type: integer }
                          sessions_touched: { type: integer }
                          assigned: { type: integer }
                          skipped: { type: integer }
        '401': { description: Unauthenticated }
        '403': { description: Wrong role }

openapi: 3.0.0
info:
  title: 'JUPEB 005 — Registration workflow'
  version: '1.0.0'
  description: |
    Enrollment lifecycle, codes, approvals, and numbering preview (`docs/005-jupeb-registration-technical-design.md`).
    Base path: **`/registration`**.

    Final number assignment for a **closed** session is triggered from **JUPEB 002**:
    `POST /sessions/{sessionId}/finalize-candidate-numbers`.

servers:
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }

tags:
  - name: Registration — institution
  - name: Registration — student
  - name: Registration — registrar

paths:
  /registration/institution/registrations:
    post:
      tags: [Registration — institution]
      summary: Create enrollment row with claim code (session must be open)
      description: |
        Creates a registration in `code_issued` state and allocates the institution claim code.

        `nin_verification_id` may reference a verification in any status (`verified`, `pending`,
        or `failed`). When `pending`, the registration row can still be claimed and progressed
        by the student, but the institution **cannot approve** until the verification resolves
        to `verified` (see `POST .../approve` 422 response).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, university_id, subject_combination_id]
              properties:
                session_id: { type: string, format: uuid }
                university_id: { type: string, format: uuid }
                subject_combination_id: { type: string, format: uuid }
                nin_verification_id: { type: string, format: uuid }
      responses:
        '201':
          description: |
            Created row includes `institution_issued_code`, `provisional_candidate_code`, and
            an embedded `nin_verification` summary (`{ id, status }`) — or `null` when no
            verification is linked.
        '409':
          description: Duplicate NIN registration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
                      institution_issued_code: { type: string }
                      provisional_candidate_code: { type: string }
                      nin_verification:
                        nullable: true
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          status:
                            type: string
                            enum: [verified, failed, pending]
                      institution_admin:
                        nullable: true
                        type: object
                        properties:
                          user_id: { type: string, format: uuid }
                          email: { type: string, format: email }
                          first_name: { type: string, nullable: true }
                          last_name: { type: string, nullable: true }
    get:
      tags: [Registration — institution]
      summary: List registrations (filters)
      description: |
        Each row includes `candidate` (`id`, `name`, `email`, `candidate_id`). Before the student claims
        the code, `candidate.id` (the linked user id) is **null**; `name` / `email` may still be populated
        from the linked `jupeb_nin_verifications` intake (`intake_payload`) or NIN provider payload when present.
        Optional `q` matches those fields in addition to profile-based name/email.

        **`bucket` vs `status`:** `bucket` is a coarse tab filter — `approved`, `pending`, `rejected`, or `withdrawn`.
        `status` is an exact match on `jupeb_registrations.status` (e.g. `pending_institution_review`). If a client
        mistakenly sends a raw workflow value as `bucket` (e.g. `bucket=pending_institution_review`) and `status`
        is not set, the server treats it as `status` and clears `bucket`. If both are set and disagree, the
        request returns **422** with a conflict message; when both match, `bucket` is cleared.
      security:
        - BearerAuth: []
      parameters:
        - name: university_id
          in: query
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: bucket
          in: query
          required: false
          schema:
            type: string
            enum: [approved, pending, rejected, withdrawn]
          description: Coarse filter tab. Raw workflow statuses belong in `status` (or are auto-remapped from `bucket` when `status` is absent).
        - name: status
          in: query
          schema: { type: string }
          description: Exact `jupeb_registrations.status` (e.g. `pending_institution_review`, `code_issued`).
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search across candidate name/email and codes (see summary).
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: |
            Paginated list with `subject_combination` (full object + `subject_items`) and enriched `candidate`.
            CSV export (`GET .../export`) uses the same subject pipeline for the `subject_combination` column.

  /registration/institution/overview/stats:
    get:
      tags: [Registration — institution]
      summary: Institution dashboard KPI counts (E.4) with growth vs prior session
      description: |
        Returns registration counts scoped to the caller's institution (and optional `session_id`).
        **`total`** counts every registration in scope (**including** `withdrawn`). **`pending`** includes `provisional` and all pre-terminal workflow states.
        **`with_biometrics`** counts registrations with at least one non-replaced biometric capture.
        **`total_subject_combinations`** is the count of **distinct** `subject_combination_id` values on
        non-withdrawn registrations in scope (null combination ids are excluded).

        When a **previous** registration session exists (earlier `opens_at`), **`growth`** includes
        `delta_pct` comparing the resolved **current** session to that baseline. If there is no
        previous session row, each `delta_pct` is null. If the baseline count for a metric was **0**
        and the current count is **positive**, `delta_pct` is **`100`** (conventional “new vs zero
        prior” for UI); if both are zero, `delta_pct` is **0**; otherwise it is the percent change
        `((current - previous) / previous) * 100` rounded to two decimals (may be negative).
        Each **`growth.*`** object also includes **`trend`**: `new` (first activity vs a zero baseline;
        pair with `delta_pct` 100), `up` / `down` / `flat` for real period-over-period changes, or
        `null` when there is no previous session to compare.
        **`compared_to`** identifies the prior session used for those deltas.

        If no registration session exists in the database, counts are zero and `compared_to` is null.
      security:
        - BearerAuth: []
      parameters:
        - name: university_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: session_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: KPI payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      total: { type: integer }
                      approved: { type: integer }
                      pending: { type: integer }
                      rejected: { type: integer }
                      with_biometrics: { type: integer }
                      compared_to:
                        nullable: true
                        type: object
                        properties:
                          session_id: { type: string, format: uuid }
                          label: { type: string, description: academic_year of the comparison session }
                      previous_session_counts:
                        nullable: true
                        type: object
                        description: KPI counts for the comparison session (same scope as top-level). When a metric was 0 here and is positive in the current session, `growth.*.delta_pct` is 100 for that metric (convention); when both are 0, delta_pct is 0.
                        properties:
                          total: { type: integer }
                          approved: { type: integer }
                          pending: { type: integer }
                          rejected: { type: integer }
                          with_biometrics: { type: integer }
                          total_subject_combinations: { type: integer }
                      growth:
                        type: object
                        properties:
                          total_registered:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
                                description: Semantic direction; use with delta_pct (e.g. new + 100 vs up + 10).
                          approved:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
                          pending:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
                          rejected:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
                          with_biometrics:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
                          total_subject_combinations:
                            type: object
                            properties:
                              value: { type: integer }
                              delta_pct: { type: number, nullable: true }
                              trend:
                                type: string
                                nullable: true
                                enum: [new, up, down, flat]
        '404':
          description: session_id was sent but session not found

  /registration/institution/registrations/{registrationId}:
    get:
      tags: [Registration — institution]
      summary: Full candidate detail (single-call composite)
      description: |
        Single-call endpoint that powers the institution dashboard's
        candidate detail page. Composes everything an institution
        reviewer needs in one response:

        - Registration row (status, codes, timestamps, status history)
        - Candidate user + profile (name, email, phone, verification
          flags, address fields, photo URL)
        - University / Subject Combination / Session display objects
        - NIN verification snapshot (id + status)
        - Documents (`jupeb_registration_documents`) with **`download_url`** when the candidate has claimed and uploaded files
        - Result entries for the registration
        - Biometric captures with optional **`preview_url`** (signed/public file URL) plus `file_id`
        - Next of kin

        On terminal status transitions, NIN `response_payload` is cleared after
        a best-effort snapshot into `profiles` and `jupeb_next_of_kin`, so
        approved candidates still surface demographics and NoK from those tables.

        **Auth:** admin / super_admin / registrar / program_director /
        institution_admin (scoped to the registration's university).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Composite candidate detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      session_id: { type: string, format: uuid, nullable: true }
                      university_id: { type: string, format: uuid, nullable: true }
                      subject_combination_id: { type: string, format: uuid, nullable: true }
                      status: { type: string }
                      status_reason: { type: string, nullable: true }
                      institution_issued_code: { type: string, nullable: true }
                      institution_code_expires_at: { type: string, format: date-time, nullable: true }
                      provisional_candidate_code: { type: string, nullable: true }
                      jupeb_candidate_number: { type: string, nullable: true }
                      claimed_at: { type: string, format: date-time, nullable: true }
                      submitted_at: { type: string, format: date-time, nullable: true }
                      approved_at: { type: string, format: date-time, nullable: true }
                      approved_by: { type: string, format: uuid, nullable: true }
                      dashboard_unlocked_at: { type: string, format: date-time, nullable: true }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      nin_verification_id: { type: string, format: uuid, nullable: true }
                      nin_verification:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string }
                      university:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          jupeb_prefix: { type: string }
                      subject_combination:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          code: { type: string }
                          title: { type: string }
                      session:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          academic_year: { type: string }
                          year_short: { type: string }
                      candidate:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, format: uuid }
                          email: { type: string }
                          phone: { type: string, nullable: true }
                          email_verified: { type: boolean }
                          phone_verified: { type: boolean }
                          last_login_at: { type: string, format: date-time, nullable: true }
                          first_name: { type: string, nullable: true }
                          last_name: { type: string, nullable: true }
                          display_name: { type: string, nullable: true }
                          date_of_birth: { type: string, format: date, nullable: true }
                          gender: { type: string, nullable: true }
                          profile_photo_url: { type: string, nullable: true }
                          residential_address: { type: string, nullable: true }
                          state_of_origin: { type: string, nullable: true }
                          lga: { type: string, nullable: true }
                          place_of_birth: { type: string, nullable: true }
                      next_of_kin:
                        type: object
                        nullable: true
                        properties:
                          name: { type: string, nullable: true }
                          relationship: { type: string, nullable: true }
                          phone: { type: string, nullable: true }
                          email: { type: string, nullable: true }
                          address: { type: string, nullable: true }
                          source:
                            type: string
                            enum: [nin, student, institution]
                            nullable: true
                      documents:
                        type: array
                        description: Per-document rows with optional signed download URL for reviewers.
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            requirement_id: { type: string, format: uuid }
                            status: { type: string }
                            file_id: { type: string, format: uuid, nullable: true }
                            source: { type: string, nullable: true }
                            sitting: { type: integer, nullable: true }
                            download_url: { type: string, nullable: true }
                            review_note: { type: string, nullable: true }
                            reviewed_at: { type: string, format: date-time, nullable: true }
                            reviewed_by: { type: string, format: uuid, nullable: true }
                            created_at: { type: string, format: date-time }
                            updated_at: { type: string, format: date-time, nullable: true }
                      result_entries:
                        type: array
                        description: Result entries grouped by (source, sitting).
                        items: { type: object }
                      biometrics:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            capture_type: { type: string, enum: [face, fingerprint] }
                            quality_score: { type: number, nullable: true }
                            captured_at: { type: string, format: date-time }
                            external_reference: { type: string, nullable: true }
                            file_id: { type: string, format: uuid, nullable: true }
                            preview_url: { type: string, nullable: true }
                      biometric_status:
                        type: string
                        enum: [yes, partial, no]
                      biometric_skips:
                        type: object
                        properties:
                          face: { type: boolean }
                          fingerprint: { type: boolean }
                      status_history:
                        type: array
                        items:
                          type: object
                          properties:
                            from_status: { type: string, nullable: true }
                            to_status: { type: string }
                            reason: { type: string, nullable: true }
                            changed_by: { type: string, format: uuid, nullable: true }
                            created_at: { type: string, format: date-time }
        '404': { description: Registration not found }
        '422': { description: Malformed registrationId }
    patch:
      tags: [Registration — institution]
      summary: Update subject combination before student confirms
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_combination_id]
              properties:
                subject_combination_id: { type: string, format: uuid }
      responses:
        '200': { description: OK }

    delete:
      tags: [Registration — institution]
      summary: Delete registration row (hard delete)
      description: |
        Permanently removes the `jupeb_registrations` row for this id. Allowed only when the row is
        **`rejected`**, **`withdrawn`**, or **`code_issued`** with **no linked student** (`user_id` is null —
        unused institution code). Child rows with `ON DELETE CASCADE` are removed; other references may
        be nullified per schema.

        Does **not** delete an institution or university — only this enrollment row.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      deleted: { type: boolean }
        '404': { description: Registration not found }
        '422': { description: Not deletable from current status, or invalid id }

  /registration/institution/registrations/{registrationId}/candidate:
    patch:
      tags: [Registration — institution]
      summary: Patch candidate profile, subject combo, and/or documents (institution)
      description: |
        Same profile field rules as `PATCH /registration/me/profile` (NIN-immutable fields, profile + users email/phone).
        Optionally updates `subject_combination_id` on the registration when the combo is active and valid for the university.
        Optionally accepts `documents`: a **non-empty** array of attach/replace operations (same file rules as student submission:
        file must be owned by the candidate or the acting institution user, unless the actor is admin/registrar/super_admin).
        Each item is either `{ "document_id", "file_id", "source"?, "sitting"? }` (replace a **submitted** row) or
        `{ "requirement_id", "file_id", "source"?, "sitting"? }` (attach; result types need `source` + `sitting` when required).
        Requires a claimed registration (`user_id` set) and an allowed status
        (`claimed`, `pending_student_confirm`, `pending_documents`, `pending_institution_review`).
        Returns the same composite payload as `GET /registration/institution/registrations/{registrationId}`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                residential_address: { type: string }
                state_of_origin: { type: string }
                lga: { type: string }
                place_of_birth: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                subject_combination_id: { type: string, format: uuid }
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      document_id: { type: string, format: uuid }
                      requirement_id: { type: string, format: uuid }
                      file_id: { type: string, format: uuid }
                      source: { type: string }
                      sitting: { type: integer }
      responses:
        '200': { description: Full candidate detail (same shape as GET) }
        '401': { description: Unauthorized }
        '404': { description: Registration not found }
        '409': { description: Email conflict }
        '422': { description: Validation, unclaimed registration, or disallowed status }

  /registration/institution/registrations/{registrationId}/resend-code:
    post:
      tags: [Registration — institution]
      summary: Re-send institution registration code email
      description: |
        Re-queues the `jupeb-code-issued` email. Only when `status` is `code_issued`, `user_id` is null,
        and the code is not past `institution_code_expires_at`. Does not rotate the code or extend expiry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      institution_issued_code: { type: string }
                      institution_code_expires_at: { type: string, format: date-time, nullable: true }
                      resent: { type: boolean }
        '401': { description: Unauthorized }
        '404': { description: Registration not found }
        '410': { description: 'Code expired; error body includes details.error_code code_expired' }
        '422': { description: Wrong status or already claimed }

  /registration/institution/registrations/batch:
    post:
      tags: [Registration — institution]
      summary: Batch approve, reject, withdraw, or delete registrations
      description: |
        Applies `approve`, `reject`, `withdraw`, or `delete` to each id independently. Never short-circuits
        on the first failure — every id receives a verdict in `accepted` or `rejected`.

        For `delete`, successful rows return `status: "deleted"` in `accepted` (hard delete; same rules as
        `DELETE .../registrations/{registrationId}`).

        For a single registration, you may use this endpoint or the per-id routes below.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  maxItems: 100
                  items: { type: string, format: uuid }
                action:
                  type: string
                  enum: [approve, reject, withdraw, delete]
                reason:
                  type: string
                  description: Required when action is `reject`; optional for `withdraw`
      responses:
        '200':
          description: |
            `{ accepted: [{ id, status }], rejected: [{ id, error_code, message, http_status }], action }`.
            In `accepted`, `status` is the new registration status after approve / reject / withdraw, or the
            literal string `deleted` after a successful hard-delete. In `rejected`, `http_status` is the
            HTTP-equivalent error for that row (often 422); the registration row was not updated (for
            `delete`, the row was not removed).
        '422':
          description: Validation error (empty ids, invalid action, reject without reason, etc.)

  /registration/institution/registrations/{registrationId}/approve:
    post:
      tags: [Registration — institution]
      summary: Approve after institution review (unlocks dashboard)
      description: |
        Transitions the registration to `approved` and sets `dashboard_unlocked_at`.
        For multiple registrations, prefer `POST .../batch` with `action: approve`.

        **NIN gate:** if the registration is linked to a `nin_verification_id` whose status is
        not `verified`, this endpoint returns `422` with a message naming the current NIN
        status (e.g. "Cannot approve while NIN verification is pending"). Resolve via
        `POST /identity/nin/verifications/{verificationId}/retry` or wait for the background
        resolver, then re-call approve.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: |
            Registration approved. Response includes embedded `nin_verification` summary.
        '422':
          description: |
            Approval blocked — either registration is not in a state that allows approval, or
            the linked NIN verification is not yet `verified`.

  /registration/institution/registrations/{registrationId}/reject:
    post:
      tags: [Registration — institution]
      summary: Reject with reason
      description: |
        For multiple registrations, prefer `POST .../batch` with `action: reject` and `reason`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: OK }

  /registration/me/code-status:
    get:
      tags: [Registration — student]
      summary: Validate an institution code without claiming it
      description: |
        Read-only probe driving the figma 6-cell code wizard. Returns whether the code
        is claimable, plus the candidate's institution name.
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Status + structured error_code on failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: { type: boolean }
                      university_name: { type: string, nullable: true }
                      university:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                          jupeb_prefix: { type: string }
                      expires_at: { type: string, format: date-time, nullable: true }
                      error_code:
                        type: string
                        enum: [code_required, code_not_found, code_expired, code_already_used]
                        description: Present only when valid is false.

  /registration/me/claim-code:
    post:
      tags: [Registration — student]
      summary: Bind institution code to authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [institution_issued_code]
              properties:
                institution_issued_code: { type: string }
      responses:
        '200': { description: OK }
        '409': { description: Code already claimed }
        '410':
          description: |
            Code expired. Body includes structured detail:
            `{ success: false, message, details: { error_code: "code_expired", expires_at } }`.

  /registration/me/current:
    get:
      tags: [Registration — student]
      summary: Current registration summary
      description: |
        Returns the candidate's current registration. Embeds:
        - `nin_verification: { id, status } | null`
        - `subject_combination: { id, code, title }`
        - `university: { id, name, jupeb_prefix }`
        - `session: { id, academic_year, year_short }`
        - `sittings_count`, `result_types`
      security:
        - BearerAuth: []
      responses:
        '200': { description: OK }

  /registration/me/profile:
    get:
      tags: [Registration — student]
      summary: Composite profile read for the wizard / Profile screen
      description: |
        Single-call composite joining users + profiles + nin_verifications + the
        candidate's registration + subject combination + university + session.
        When the linked NIN verification is `pending`, NIN-derived fields fall back to
        the cached `intake_payload` so the student never re-types their info.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Composite payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidate:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          full_name: { type: string, nullable: true }
                          provisional_candidate_code: { type: string, nullable: true }
                          jupeb_candidate_number: { type: string, nullable: true }
                          status: { type: string }
                          photo_url: { type: string, nullable: true }
                      basic_information:
                        type: object
                        properties:
                          date_of_birth: { type: string, format: date, nullable: true }
                          gender: { type: string, nullable: true }
                          residential_address: { type: string, nullable: true }
                          state_of_origin: { type: string, nullable: true }
                          lga: { type: string, nullable: true }
                          place_of_birth: { type: string, nullable: true }
                      contact_information:
                        type: object
                        properties:
                          email: { type: string, format: email, nullable: true }
                          phone: { type: string, nullable: true }
                      next_of_kin:
                        type: object
                        nullable: true
                        properties:
                          name: { type: string }
                          relationship: { type: string }
                          contact: { type: string }
                      subject_combination: { type: object }
                      university: { type: object }
                      session: { type: object }
                      nin_verification: { type: object, nullable: true }

  /registration/me/submission-preview:
    get:
      tags: [Registration — student]
      summary: Aggregated submission preview (final review screen)
      description: |
        Composite read for the figma "Submit Details" screen. Includes everything in
        `/me/profile` plus an array of uploaded documents (with signed download URLs)
        and a biometric coverage summary.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Composite preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidate: { type: object }
                      basic_information: { type: object }
                      contact_information: { type: object }
                      next_of_kin: { type: object, nullable: true }
                      subject_combination: { type: object }
                      university: { type: object }
                      session: { type: object }
                      nin_verification: { type: object, nullable: true }
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            requirement_id: { type: string, format: uuid }
                            status: { type: string }
                            file_id: { type: string, format: uuid, nullable: true }
                            download_url: { type: string, nullable: true }
                            created_at: { type: string, format: date-time }
                      biometrics:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            capture_type: { type: string, enum: [face, fingerprint] }
                            quality_score: { type: number, nullable: true }
                            captured_at: { type: string, format: date-time }
                      biometric_status:
                        type: string
                        enum: [none, partial, complete]

  /registration/me/academic-intake:
    patch:
      tags: [Registration — student]
      summary: Set sittings count + result types (WAEC/NECO/etc.)
      description: |
        Drives the figma Document Upload form. `sittings_count` must be 1 or 2;
        `result_types` accepts entries from the set `waec`, `neco`, `gce`, `nabteb`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sittings_count, result_types]
              properties:
                sittings_count: { type: integer, enum: [1, 2] }
                result_types:
                  type: array
                  items: { type: string, enum: [waec, neco, gce, nabteb] }
                  minItems: 1
      responses:
        '200': { description: Updated registration row }
        '404': { description: No registration found for current user }
        '422': { description: Validation error }

  /registration/me/confirm-subjects:
    post:
      tags: [Registration — student]
      summary: Confirm subject combination (optional body to change combo while allowed)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_combination_id: { type: string, format: uuid }
      responses:
        '200': { description: OK }

  /registration/me/submit:
    post:
      tags: [Registration — student]
      summary: Submit to institution review
      security:
        - BearerAuth: []
      responses:
        '200': { description: OK }

  /registration/me/dashboard-access:
    get:
      tags: [Registration — student]
      summary: Locked / unlocked dashboard state
      security:
        - BearerAuth: []
      responses:
        '200': { description: OK }

  /registration/sessions/{sessionId}/numbering-preview:
    get:
      tags: [Registration — registrar]
      summary: Dry-run final candidate numbers (session must be closed)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Response data includes proposed numbering rows and any conflicts array
        '422':
          description: Session not closed

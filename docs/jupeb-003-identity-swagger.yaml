openapi: 3.0.0
info:
  title: 'JUPEB 003 — Identity'
  version: '1.0.0'
  description: |
    NIN verification and biometric captures linked to registrations (`docs/003-jupeb-identity-technical-design.md`).
    Base path: **`/identity`**.

servers:
  - url: http://localhost:5000
    description: Local development

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    NinVerifySubjectCombination:
      type: object
      nullable: true
      description: |
        Returned when `intake_payload.subject_combination_id` matches an **active** catalog row
        (8-4-4-4-12 hex id, as accepted by PostgreSQL — not limited to strict RFC variant/version nibbles).
        Same composite shape as institution registration list (`code`, `title`, timestamps,
        `subject_items[]`, etc.). Omitted when the id is missing, malformed, or the combo is inactive.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        status: { type: string }
        is_global: { type: boolean }
        university_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
        subject_items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              position: { type: integer }
              subject_id: { type: string, format: uuid }
              code: { type: string }
              name: { type: string }
  parameters:
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CaptureId:
      name: captureId
      in: path
      required: true
      schema: { type: string, format: uuid }

tags:
  - name: Identity — NIN
  - name: Identity — Biometrics

paths:
  /identity/nin/verify:
    post:
      tags: [Identity — NIN]
      summary: Verify NIN via configured provider (mock in dev)
      description: |
        Allowed roles include `program_director`, `institution_admin`, `registrar`, `admin`, `super_admin`.
        Response never returns raw NIN; profile fields come from provider payload.

        ## Mock provider (`JUPEB_NIN_PROVIDER=mock`, default)
        The in-process **mock** does **not** call the national database. Unless
        `JUPEB_NIN_MOCK_STRICT=1` is set, **any valid 11-digit NIN** (except all zeros)
        returns `status: verified` with a synthetic profile — useful for local dev
        and CI, but **not** a test of whether a NIN exists. Use **`JUPEB_NIN_PROVIDER=speedysms`**
        with a real `SPEEDYSMS_API_KEY` for production-like acceptance/refusal, or set
        **`JUPEB_NIN_MOCK_STRICT=1`** to restrict the mock to NINs `00000000001`–`00000000010`
        (same idea as SpeedySMS’s documented test pool).

        ## Pending state
        When the upstream NIN provider is unavailable (timeout, 5xx, circuit-open), the verification
        is persisted with `status = pending` and a `retry_after` timestamp. The candidate's intake fields
        (name, email, phone, subject_combination_id) are stored on the row so they don't need to be
        re-typed. A background resolver and the explicit retry endpoint flip the row to `verified`
        or `failed` once the provider responds. Webhooks `jupeb.nin.verified` and `jupeb.nin.failed`
        are fired on resolution.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nin]
              properties:
                nin:
                  type: string
                  description: 11-digit Nigerian NIN
                  example: '12345678901'
                idempotency_key:
                  type: string
                intake_payload:
                  type: object
                  description: Candidate fields captured alongside the NIN; persisted on the verification row so the form is not lost when the provider is unavailable. Not forwarded to the upstream NIN API — only `nin` (and optional overrides below) are sent to SpeedySMS.
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    subject_combination_id: { type: string, description: 'Catalog combination id (8-4-4-4-12 hex; PostgreSQL uuid)' }
                provider:
                  type: string
                  description: |
                    When `JUPEB_NIN_PROVIDER=speedysms`, forwarded on the upstream POST body.
                    Use `mock` to hit SpeedySMS’s free test NIN pool (`00000000001`–`00000000010`) without billing the live identity pool.
                force_fresh:
                  type: boolean
                  description: When true, forwarded upstream to bypass SpeedySMS cache (full-price lookup). Ignored when the active provider is `mock`.
      responses:
        '200':
          description: |
            Verification result. The response `data.status` is one of:
              - `verified` — provider returned a valid profile.
              - `failed` — provider rejected the NIN (terminal).
              - `pending` — provider unavailable; will be retried automatically. Response also includes `retry_after` (ISO timestamp) and `last_error_code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      verification_id: { type: string, format: uuid }
                      status:
                        type: string
                        enum: [verified, failed, pending]
                      profile:
                        type: object
                        description: >
                          NIN provider profile (flat + nested fields). SpeedySMS supplies
                          birthplace, residence, next_of_kin_record, provider_lookup, photo_url, etc.
                          Mock mirrors the same shape in development. Registrar-typed intake
                          (name, email, phone, subject_combination_id) is only on `intake_payload`
                          and `subject_combination` — not duplicated under `profile`.
                      intake_payload:
                        type: object
                        description: Echo of the candidate fields submitted with this verify call (when provided).
                      subject_combination:
                        $ref: '#/components/schemas/NinVerifySubjectCombination'
                      caller_user:
                        type: object
                        nullable: true
                        description: Present when the request is authenticated — the registrar’s user row + profile (not the candidate).
                      registration:
                        type: object
                        nullable: true
                        description: Present when a `jupeb_registrations` row already references this `verification_id`.
                      retry_after:
                        type: string
                        format: date-time
                        description: Present when status=pending. Earliest moment the resolver will re-attempt.
                      last_error_code:
                        type: string
                        description: Present when status=pending. e.g. `provider_unavailable`.
                      error: { type: object, description: Present when status=failed. }
        '401': { description: Unauthorized }
        '422': { description: Invalid NIN format }

  /identity/nin/verifications/{verificationId}:
    get:
      tags: [Identity — NIN]
      summary: Get verification record (sanitized)
      description: |
        Returns the persisted state of a NIN verification. For pending rows the response
        carries the candidate's `intake_payload` (the form fields submitted alongside the
        NIN), `attempt_count`, `retry_after`, and `last_error_code` so clients can reflect
        the current resolution state without polling.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      responses:
        '200':
          description: |
            Sanitized verification row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      nin_last4: { type: string }
                      provider: { type: string }
                      provider_reference: { type: string, nullable: true }
                      status:
                        type: string
                        enum: [verified, failed, pending]
                      response_payload: { type: object }
                      error_payload: { type: object }
                      verified_at: { type: string, format: date-time, nullable: true }
                      requested_by: { type: string, format: uuid, nullable: true }
                      created_at: { type: string, format: date-time }
                      intake_payload:
                        type: object
                        description: Candidate fields submitted with the original verify call (name, email, phone, subject_combination_id).
                      attempt_count: { type: integer }
                      retry_after: { type: string, format: date-time, nullable: true }
                      last_error_code: { type: string, nullable: true }
        '403': { description: Not owner / not privileged }
        '404': { description: Not found }

  /identity/nin/verifications/{verificationId}/intake:
    patch:
      tags: [Identity — NIN]
      summary: Merge intake fields without re-verifying NIN
      description: |
        Shallow-merges `name`, `email`, `phone`, and/or `subject_combination_id` into the verification row
        (same keys as `POST /identity/nin/verify`). **Preferred:** send those keys on the **root** JSON object.
        **Legacy:** `{ "intake_payload": { ... } }` is still accepted; when both are present, root-level keys win.
        Does not call the NIN provider.
        When a registration references this verification, institution callers must be scoped to that university;
        registrar/admin may update verifications with no registration link. **422** if the linked registration is terminal.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                subject_combination_id: { type: string, format: uuid }
                intake_payload:
                  type: object
                  description: Legacy nested object; same property keys as root.
                  properties:
                    name: { type: string }
                    email: { type: string, format: email }
                    phone: { type: string }
                    subject_combination_id: { type: string, format: uuid }
      responses:
        '200':
          description: Updated verification (same shape as GET /identity/nin/verifications/{id})
        '401': { description: Unauthorized }
        '403': { description: Access denied }
        '404': { description: Verification not found }
        '422': { description: Empty merge, invalid combo, or terminal registration }

  /identity/nin/verifications/{verificationId}/retry:
    post:
      tags: [Identity — NIN]
      summary: Re-attempt a pending NIN verification
      description: |
        Manually re-trigger NIN verification for a row in `pending` state. Idempotent: if the
        verification is already terminal (`verified` or `failed`), the current state is returned
        unchanged.

        On a successful resolution this fires `jupeb.nin.verified` (or `jupeb.nin.failed`) webhooks
        and queues a `jupeb_nin_verified` / `jupeb_nin_failed` in-app notification for the candidate.

        Allowed roles match `POST /identity/nin/verify`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationId'
      responses:
        '200':
          description: |
            Updated verification state. `data.status` may still be `pending` if the provider is
            still unavailable; in that case `attempt_count` is incremented and `retry_after` is
            pushed forward by the backoff schedule.
        '401': { description: Unauthorized }
        '404': { description: Verification not found }
        '422': { description: Invalid verification id }

  /identity/biometrics:
    post:
      tags: [Identity — Biometrics]
      summary: Record a biometric capture for a registration
      description: |
        **Face (selfie):** use `file_id` from `POST /files/upload` (do not put the
        file UUID in `external_reference`). On success the durable `files.file_url`
        is written to the registration owner's `profiles.profile_photo_url`, replacing
        any expiring NIN provider photo. Exactly one of `file_id` or `external_reference`.

        **Fingerprint (device-local):** after successful device auth, send
        `confirmed: true` (no token/value required from the device). The server
        stores `external_reference = "device_local_auth"`. You may still send an
        explicit `external_reference` if you have one. There is no file upload.
        If unavailable, call `POST /identity/registrations/{id}/biometrics/skip`
        with `{ "capture_type": "fingerprint" }` instead.

        **Self-service lock:** if the registration's matching `*_skipped_at` column is set
        and the caller is not a privileged role (`super_admin`, `admin`, `registrar`,
        `program_director`, `institution_admin`), this returns 403. Privileged users can
        still capture on the candidate's behalf.

        **Quality threshold:** when `JUPEB_FACE_MIN_QUALITY` is set, face captures with
        `quality_score` below the threshold return 422.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_id, capture_type]
              properties:
                registration_id: { type: string, format: uuid }
                capture_type:
                  type: string
                  enum: [face, fingerprint]
                file_id:
                  type: string
                  format: uuid
                  description: Required for face selfies (XOR with external_reference)
                external_reference:
                  type: string
                  description: Optional for fingerprint if confirmed is true; XOR with file_id for face
                confirmed:
                  type: boolean
                  description: |
                    Fingerprint only. Set true after successful device-local biometric auth
                    when there is no token to send. Server stores external_reference=device_local_auth.
                quality_score: { type: number, minimum: 0, maximum: 1 }
                device_metadata: { type: object }
                captured_at: { type: string, format: date-time }
      responses:
        '201': { description: Created }
        '403': { description: Access denied or self-service capture is locked }
        '404': { description: Face file_id not found }
        '409': { description: Duplicate active capture type for registration }
        '422': { description: Validation error or quality below threshold }

  /identity/biometrics/{captureId}:
    put:
      tags: [Identity — Biometrics]
      summary: Replace a biometric capture in place
      description: |
        Soft-archives the existing row by setting `replaced_at`, then inserts a fresh
        capture for the same `(registration_id, capture_type)`. The unique index excludes
        replaced rows, so re-capture works without manual delete.

        When replacing a face capture with a new `file_id`, also overwrites
        `profiles.profile_photo_url` with the durable file URL (same as create).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file_id:
                  type: string
                  format: uuid
                  description: Use for face selfie replacement (XOR with external_reference)
                external_reference:
                  type: string
                  description: Use for fingerprint / vault refs (XOR with file_id)
                quality_score: { type: number }
                device_metadata: { type: object }
                captured_at: { type: string, format: date-time }
      responses:
        '200': { description: New active capture row }
        '404': { description: Capture or face file_id not found }
        '422': { description: Already replaced or invalid payload }
    delete:
      tags: [Identity — Biometrics]
      summary: Delete a biometric capture
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200': { description: Deleted or not found per implementation }

  /identity/registrations/{registrationId}/biometrics:
    get:
      tags: [Identity — Biometrics]
      summary: List biometric captures for a registration
      description: |
        Returns all rows including `replaced_at`-archived ones. Active captures are those
        with `replaced_at = null`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200': { description: Array in response data }

  /identity/registrations/{registrationId}/biometrics/skip:
    post:
      tags: [Identity — Biometrics]
      summary: Mark a biometric capture type as skipped (locks self-service)
      description: |
        Stamps `fingerprint_skipped_at` or `face_skipped_at` on the registration. While
        the column is set, non-privileged callers receive 403 from `POST /identity/biometrics`
        for that capture type — matching the figma "skip → contact your institution" copy.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capture_type]
              properties:
                capture_type:
                  type: string
                  enum: [face, fingerprint]
      responses:
        '200': { description: Updated registration row with skip timestamp }
        '404': { description: Registration not found }
        '422': { description: Invalid capture_type }

  /identity/registrations/{registrationId}/photo:
    get:
      tags: [Identity — Biometrics]
      summary: URL for the latest face capture file
      description: |
        Returns `{ url, file_id, file_type, captured_at }` for the most recent face
        capture that has a `file_id` (selfie uploaded via `/files`). Face rows that
        only have `external_reference` are ignored here — use `file_id` for selfies.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200': { description: URL + metadata }
        '404': { description: No face capture for this registration }

              type: integer
            credits:
              type: integer
            passes:
              type: integer
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 92.4
        warnings:
          type: array
          items:
            type: string
          example:
            - low_confidence_field:candidate.date_of_birth
    OcrJob:
      type: object
      required:
        - job_id
        - file_id
        - status
        - exam_type
        - provider
      properties:
        job_id:
          type: string
          format: uuid
        file_id:
          type: string
          format: uuid
        exam_type:
          $ref: '#/components/schemas/ExamType'
        provider:
          type: string
          enum:
            - pdf_text
            - tesseract
            - ocr_space
            - aws_textract
            - google_doc_ai
            - mock
          description: |
            Provider that produced the result. Default chain is
            `pdf_text` → `tesseract` (both free, in-process). `ocr_space`,
            `aws_textract`, and `google_doc_ai` are optional fallbacks. `mock`
            is test-only and is never returned in production.
        status:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
        attempt_count:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        result:
          allOf:
            - $ref: '#/components/schemas/OcrResult'
          nullable: true
        raw_text_excerpt:
          type: string
          nullable: true
          description: First ~500 chars of OCR text. Full text only for staff.
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
              example: OCR_PROVIDER_TIMEOUT
            message:
              type: string
    CreateJobJsonBody:
      type: object

openapi: 3.0.3
info:
  title: JUPEB Registration & Administration Portal API
  version: 1.0.0
  description: |-
    Complete OpenAPI 3.0 Specification for the JUPEB Registration Portal API.
    Import directly into Postman, Insomnia, or Swagger UI.

    ### Modules Covered:
    - **Auth & SSO**: Registration, login, verification, OAuth, RS256 token exchange
    - **Users & RBAC**: User profiles, roles, and granular permissions
    - **JUPEB Catalog**: Participating universities, courses, subject combinations
    - **Academic Sessions**: Registration sessions, deadlines, quotas, fees
    - **Identity & Biometrics**: NIN verification and verification gating
    - **OCR Engine**: AI-assisted examination result extraction (WAEC/NECO/NABTEB)
    - **Submissions**: Candidate document uploads, reviews, and status workflow
    - **Candidate Registrations**: Application processing, candidate profiles, slips
    - **Finance & Payments**: Invoicing, payment gateway verification, reconciliation
    - **Academic Results**: Continuous assessment and exam result management
    - **Observability & Admin**: Audit trails, system logs, error metrics, settings
    - **Support Tickets**: Student ticket submissions, institution scoping, threads
    - **Attendance & Timetable**: Student biometric tracking and schedules
    - **CRMS**: Candidate result management and course transcripts
    - **Files, Notifications, Webhooks, Assets, API Keys, Posts**
  contact:
    name: JUPEB Technical Team
    email: support@jupeb.edu.ng
servers:
  - url: http://localhost:5000
    description: Local Development Server
  - url: https://api.regportal.jupeb.edu.ng
    description: Production Server
tags:
  - name: Academic — courses
  - name: Academic — results
  - name: API Keys
    description: API Keys endpoints
  - name: Asset Groups
    description: Asset Groups endpoints
  - name: Assets
    description: Assets endpoints
  - name: Attendance
    description: Student biometric & QR attendance endpoints
  - name: Audit Log
    description: Audit Log endpoints
  - name: Auth
    description: Auth endpoints
  - name: Bank accounts
    description: Bank accounts endpoints
  - name: Catalog — admin
    description: Requires JWT; roles `admin`, `super_admin`, or `registrar`
  - name: Catalog — public
    description: Unauthenticated read for preload UIs
  - name: Countries
    description: Countries endpoints
  - name: CRMS
    description: Candidate academic results and course records
  - name: Error Logs
    description: Error Logs endpoints
  - name: Files
    description: Files endpoints
  - name: Finance — admin
  - name: Finance — institution
  - name: Finance — student
  - name: Identity — Biometrics
  - name: Identity — NIN
  - name: JUPEB — dashboard
  - name: JUPEB — institution scope (admin)
  - name: Notifications
    description: Notifications endpoints
  - name: OAuth
    description: OAuth endpoints
  - name: OCR
  - name: Payment methods
    description: Payment methods endpoints
  - name: Payments
    description: Payments endpoints
  - name: Payments — Admin
    description: Payments — Admin endpoints
  - name: Platform Settings
    description: Platform Settings endpoints
  - name: Post comments
    description: Post comments endpoints
  - name: Posts
    description: Posts endpoints
  - name: Posts — Admin
    description: Posts — Admin endpoints
  - name: Posts — Engagement
    description: Posts — Engagement endpoints
  - name: Posts — Feeds
    description: Posts — Feeds endpoints
  - name: RBAC
    description: RBAC endpoints
  - name: Registration — institution
  - name: Registration — registrar
  - name: Registration — student
  - name: Sessions
    description: |
      Authenticated reads; writes require `registrar`/`admin`/`super_admin`
      (reopen is `super_admin` only).
  - name: Submission — admin
  - name: Submission — institution
  - name: Submission — student
  - name: Support - Admin
    description: Central administrative support management across all institutions
  - name: Support - Institution
    description: Institution staff ticket management scoped to their university
  - name: Support - Public
    description: Public support endpoints (dropdown options)
  - name: Support - Student
    description: Student-facing support ticket submissions and conversation threads
  - name: Users
    description: Users endpoints
  - name: Webhooks
    description: Webhooks endpoints
  - name: WebSocket
    description: WebSocket endpoints
paths:
  /academic/courses:
    get:
      tags:
        - Academic — courses
      summary: List active courses (public)
      security: []
      responses:
        '200':
          description: Array in response data
    post:
      tags:
        - Academic — courses
      summary: Create course
      description: Roles `registrar`, `admin`, `super_admin`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - title
              properties:
                code:
                  type: string
                title:
                  type: string
      responses:
        '201':
          description: Created
        '409':
          description: Duplicate code
  /academic/registrations/{registrationId}/recompute-score:
    post:
      tags:
        - Academic — results
      summary: Force recompute score snapshot from stored results
      description: Roles `registrar`, `admin`, `super_admin` only.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Snapshot row in response data
  /academic/registrations/{registrationId}/results:
    get:
      tags:
        - Academic — results
      summary: List course results for a registration
      description: Student owner or privileged institution/registrar roles.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Array in response data
    post:
      tags:
        - Academic — results
      summary: Bulk upsert grades (recomputes score snapshot)
      description: Roles `registrar`, `institution_admin`, `admin`, `super_admin`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - results
              properties:
                results:
                  type: array
                  items:
                    type: object
                    required:
                      - course_id
                      - grade
                    properties:
                      course_id:
                        type: string
                        format: uuid
                      grade:
                        type: string
                        enum:
                          - A
                          - B
                          - C
                          - D
                          - E
                          - F
      responses:
        '200':
          description: Saved rows array in response data
        '422':
          description: Invalid grade or inactive course
  /academic/registrations/{registrationId}/score:
    get:
      tags:
        - Academic — results
      summary: Score breakdown (live aggregate + stored snapshot)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: |
            Includes results, aggregate (passed_courses_count, failed_courses_count, plus_one_total), and snapshot
  /admin/audit:
    get:
      summary: List admin audit log entries
      tags:
        - Audit Log
      parameters:
        - in: query
          name: admin_user_id
          schema:
            type: string
            format: uuid
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: resource_type
          schema:
            type: string
        - in: query
          name: start_date
          schema:
            type: string
            format: date-time
        - in: query
          name: end_date
          schema:
            type: string
            format: date-time
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated audit log
  /admin/error-logs:
    get:
      summary: List error / slow request logs
      tags:
        - Error Logs
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: type
          schema:
            type: string
            enum:
              - error
              - slow
              - 4xx
              - 5xx
              - all
        - in: query
          name: method
          schema:
            type: string
        - in: query
          name: path
          schema:
            type: string
            description: ILIKE substring match
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated log entries (summary view)
  /admin/error-logs/stats:
    get:
      summary: Aggregate error + traffic stats
      tags:
        - Error Logs
      responses:
        '200':
          description: Totals, 24h/hour error counts, success/error request counts, avg error duration
  /admin/error-logs/{id}:
    get:
      summary: Get a single log entry with full request / response bodies
      tags:
        - Error Logs
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Full log entry
  /admin/permissions:
    get:
      summary: List permissions
      description: |
        Default mode is paginated. With `?group_by=role` the response is an array of
        `{ role_id, role_name, display_name, permissions[] }` groups instead of a flat
        list.
      tags:
        - RBAC
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: resource
          schema:
            type: string
          description: Filter by resource (flat mode only)
        - in: query
          name: group_by
          schema:
            type: string
            enum:
              - role
      responses:
        '200':
          description: Paginated list, or grouped array when `group_by=role`.
    post:
      summary: Create a permission
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resource
                - action
              properties:
                resource:
                  type: string
                  description: Lowercase snake_case (e.g. `users`, `jupeb_registration`)
                action:
                  type: string
                  description: Lowercase snake_case (e.g. `read`, `approve`)
                name:
                  type: string
                  description: |
                    Optional fully-qualified permission name. Defaults to `resource:action`.
                description:
                  type: string
      responses:
        '201':
          description: Created permission
        '409':
          description: Duplicate name or resource+action
        '422':
          description: Validation error
  /admin/permissions/{permissionId}:
    parameters:
      - in: path
        name: permissionId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a permission by id
      tags:
        - RBAC
      responses:
        '200':
          description: Permission
        '404':
          description: Not found
    patch:
      summary: Update a permission
      tags:
        - RBAC
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                resource:
                  type: string
                action:
                  type: string
                description:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated permission
        '409':
          description: Conflict
    delete:
      summary: Delete a permission
      description: |
        Cascades: removes the permission from any role that had it attached
        (via `role_permissions` ON DELETE CASCADE).
      tags:
        - RBAC
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
  /admin/roles:
    get:
      summary: List roles (paginated)
      tags:
        - RBAC
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        display_name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        is_system:
                          type: boolean
                        created_at:
                          type: string
                          format: date-time
                        updated_at:
                          type: string
                          format: date-time
    post:
      summary: Create a role
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - display_name
              properties:
                name:
                  type: string
                  description: Lowercase snake_case, 2-50 chars (e.g. `program_director`).
                display_name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Created role
        '409':
          description: Role with this name already exists
        '422':
          description: Validation error
  /admin/roles/{roleId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get a role by id
      tags:
        - RBAC
      responses:
        '200':
          description: Role
        '404':
          description: Not found
    patch:
      summary: Update a role
      description: |
        Non-system roles: any of `name`, `display_name`, `description` may be patched.
        System roles: only `description` may be patched (rename/delete are blocked).
      tags:
        - RBAC
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                display_name:
                  type: string
                description:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated role
        '409':
          description: Name conflict
        '422':
          description: System role cannot have name changed
    delete:
      summary: Delete a non-system role
      tags:
        - RBAC
      responses:
        '200':
          description: Deleted
        '404':
          description: Not found
        '422':
          description: System roles cannot be deleted
  /admin/roles/{roleId}/permissions:
    parameters:
      - in: path
        name: roleId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List permissions attached to a role
      tags:
        - RBAC
      responses:
        '200':
          description: Array of permissions
  /admin/roles/{roleId}/permissions/{permissionId}:
    parameters:
      - in: path
        name: roleId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: permissionId
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Attach a permission to a role
      description: 'Idempotent. Returns `{ attached: false }` if already attached.'
      tags:
        - RBAC
      responses:
        '200':
          description: Permission attached (or already attached)
        '404':
          description: Role or permission not found
    delete:
      summary: Detach a permission from a role
      description: 'Idempotent. Returns `{ detached: false }` if it was not attached.'
      tags:
        - RBAC
      responses:
        '200':
          description: Permission detached (or was not attached)
  /admin/settings:
    get:
      summary: List all platform settings
      tags:
        - Platform Settings
      responses:
        '200':
          description: Array of settings
    put:
      summary: Upsert a platform setting
      tags:
        - Platform Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - value
              properties:
                key:
                  type: string
                  example: feature_flag_new_dashboard
                value:
                  description: JSONB value — any shape
                  example: true
                description:
                  type: string
      responses:
        '200':
          description: Setting upserted
  /admin/users:
    get:
      summary: List all users (paginated)
      description: |
        Requires the `users.view` permission. Same handler as `GET /users`.
        Returns users with profile fields and active role names.
      tags:
        - Users
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Paginated list of users
        '401':
          description: Unauthorized
        '403':
          description: Missing users.view permission
    post:
      summary: Create a user and bind to a JUPEB university
      description: |
        Requires `users.create`. System roles (`institution_admin`, `program_director`,
        `student`, etc.) are pre-seeded — assign them by name here. Do **not** call
        `POST /admin/roles` to recreate system roles.

        Institution-scoped callers may only assign institution-appropriate system roles
        plus custom roles they created. `university_id` defaults to the caller's
        institution when omitted.
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - first_name
                - last_name
                - role
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                password:
                  type: string
                  minLength: 8
                first_name:
                  type: string
                last_name:
                  type: string
                role:
                  type: string
                  description: Existing `roles.name` (e.g. `institution_admin`)
                university_id:
                  type: string
                  format: uuid
                  nullable: true
                is_primary:
                  type: boolean
                  default: true
      responses:
        '201':
          description: User created (optionally bound to university)
        '403':
          description: Role or university outside institution scope
        '409':
          description: Email/phone already exists
  /admin/users/{userId}/jupeb-university:
    patch:
      tags:
        - JUPEB — institution scope (admin)
      summary: Set or clear JUPEB university on a user profile
      description: |
        Updates `profiles.jupeb_university_id`. If the target has no profile row, one is inserted.
        If a non-null id is given, the university must exist and be **active** (`404` otherwise).
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchJupebUniversityBody'
            examples:
              set:
                summary: Bind to a university
                value:
                  jupeb_university_id: 00000000-0000-4000-8000-000000000001
              clear:
                summary: Clear binding
                value:
                  jupeb_university_id: null
      responses:
        '200':
          description: Success — `data` is the profile row (user_id, jupeb_university_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: JUPEB institution scope updated
                  data:
                    $ref: '#/components/schemas/JupebUniversityScopeRow'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — not admin, super_admin, or registrar
        '404':
          description: Target user not found, or JUPEB university missing/inactive
        '422':
          description: |
            `jupeb_university_id` missing from body, or invalid UUID for path/body
        '500':
          description: Server error
  /admin/users/{userId}/roles:
    parameters:
      - in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List roles assigned to a user
      tags:
        - RBAC
      responses:
        '200':
          description: Array of role rows (with `assigned_at`, `expires_at`).
    patch:
      summary: Assign / unassign roles for a user
      description: |
        Three mutually-compatible operations:

        - `role_ids: [uuid, ...]` — **replace** the user's full role set with this list.
        - `add: [uuid, ...]` — additively grant these roles (idempotent on duplicates).
        - `remove: [uuid, ...]` — revoke these roles (idempotent if absent).

        At least one of these must be provided. Each role id is validated to exist
        before any write.
      tags:
        - RBAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                add:
                  type: array
                  items:
                    type: string
                    format: uuid
                remove:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: User's resulting active role list
        '404':
          description: User or role not found
        '422':
          description: No operation provided or invalid uuid
  /api-keys:
    get:
      summary: List your API keys (hashes not returned)
      tags:
        - API Keys
      responses:
        '200':
          description: Array of keys with name, key_prefix, status, last_used_at
    post:
      summary: Generate a new API key
      tags:
        - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Human-readable label for the key
                  example: Production server
      responses:
        '201':
          description: |
            Key created. The full `key` field is only returned in this response —
            save it securely, it cannot be retrieved again.
  /api-keys/{id}:
    delete:
      summary: Revoke an API key
      tags:
        - API Keys
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Key revoked (status set to 'revoked'; not deleted)
        '404':
          description: Key not found
  /assets:
    get:
      summary: List assets for the current user
      tags:
        - Assets
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            maximum: 100
        - in: query
          name: group_id
          schema:
            type: string
            format: uuid
        - in: query
          name: type
          schema:
            type: string
            enum:
              - image
              - video
              - document
        - in: query
          name: tags
          schema:
            type: string
            description: Comma-separated tags
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sort
          schema:
            type: string
            default: created_at
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: Paginated asset list
  /assets/batch-tag:
    post:
      summary: Batch-update tags on multiple assets
      tags:
        - Assets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - asset_ids
                - tags
              properties:
                asset_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                tags:
                  type: array
                  items:
                    type: string
                mode:
                  type: string
                  enum:
                    - add
                    - replace
                    - remove
      responses:
        '200':
          description: Tags updated
  /assets/groups:
    get:
      summary: List all asset groups
      tags:
        - Asset Groups
      responses:
        '200':
          description: Group list
    post:
      summary: Create an asset group
      tags:
        - Asset Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
                color:
                  type: string
                  example: '#3B82F6'
                icon:
                  type: string
      responses:
        '201':
          description: Group created
  /assets/groups/{groupId}:
    get:
      summary: Get asset group by ID
      tags:
        - Asset Groups
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group details
    put:
      summary: Update asset group
      tags:
        - Asset Groups
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group updated
    delete:
      summary: Delete asset group
      tags:
        - Asset Groups

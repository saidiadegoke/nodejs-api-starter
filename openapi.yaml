          description: Registration not found
        '422':
          description: Not deletable from current status
          or invalid id: null
  /registration/institution/registrations/{registrationId}/approve:
    post:
      tags:
        - Registration — institution
      summary: Approve after institution review (unlocks dashboard)
      description: |
        Transitions the registration to `approved` and sets `dashboard_unlocked_at`.
        For multiple registrations, prefer `POST .../batch` with `action: approve`.

        **NIN gate:** if the registration is linked to a `nin_verification_id` whose status is
        not `verified`, this endpoint returns `422` with a message naming the current NIN
        status (e.g. "Cannot approve while NIN verification is pending"). Resolve via
        `POST /identity/nin/verifications/{verificationId}/retry` or wait for the background
        resolver, then re-call approve.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: |
            Registration approved. Response includes embedded `nin_verification` summary.
        '422':
          description: |
            Approval blocked — either registration is not in a state that allows approval, or
            the linked NIN verification is not yet `verified`.
  /registration/institution/registrations/{registrationId}/candidate:
    patch:
      tags:
        - Registration — institution
      summary: Patch candidate profile, subject combo, and/or documents (institution)
      description: |
        Same profile field rules as `PATCH /registration/me/profile` (NIN-immutable fields, profile + users email/phone).
        Optionally updates `subject_combination_id` on the registration when the combo is active and valid for the university.
        Optionally accepts `documents`: a **non-empty** array of attach/replace operations (same file rules as student submission:
        file must be owned by the candidate or the acting institution user, unless the actor is admin/registrar/super_admin).
        Each item is either `{ "document_id", "file_id", "source"?, "sitting"? }` (replace a **submitted** row) or
        `{ "requirement_id", "file_id", "source"?, "sitting"? }` (attach; result types need `source` + `sitting` when required).
        Requires a claimed registration (`user_id` set) and an allowed status
        (`claimed`, `pending_student_confirm`, `pending_documents`, `pending_institution_review`).
        Returns the same composite payload as `GET /registration/institution/registrations/{registrationId}`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                residential_address:
                  type: string
                state_of_origin:
                  type: string
                lga:
                  type: string
                place_of_birth:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                subject_combination_id:
                  type: string
                  format: uuid
                documents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      document_id:
                        type: string
                        format: uuid
                      requirement_id:
                        type: string
                        format: uuid
                      file_id:
                        type: string
                        format: uuid
                      source:
                        type: string
                      sitting:
                        type: integer
      responses:
        '200':
          description: Full candidate detail (same shape as GET)
        '401':
          description: Unauthorized
        '404':
          description: Registration not found
        '409':
          description: Email conflict
        '422':
          description: Validation
          unclaimed registration: null
          or disallowed status: null
  /registration/institution/registrations/{registrationId}/reject:
    post:
      tags:
        - Registration — institution
      summary: Reject with reason
      description: |
        For multiple registrations, prefer `POST .../batch` with `action: reject` and `reason`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: OK
  /registration/institution/registrations/{registrationId}/resend-code:
    post:
      tags:
        - Registration — institution
      summary: Re-send institution registration code email
      description: |
        Re-queues the `jupeb-code-issued` email. Only when `status` is `code_issued`, `user_id` is null,
        and the code is not past `institution_code_expires_at`. Does not rotate the code or extend expiry.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      responses:
        '200':
          description: Acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      institution_issued_code:
                        type: string
                      institution_code_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      resent:
                        type: boolean
        '401':
          description: Unauthorized
        '404':
          description: Registration not found
        '410':
          description: Code expired; error body includes details.error_code code_expired
        '422':
          description: Wrong status or already claimed
  /registration/me/academic-intake:
    patch:
      tags:
        - Registration — student
      summary: Set sittings count + result types (WAEC/NECO/etc.)
      description: |
        Drives the figma Document Upload form. `sittings_count` must be 1 or 2;
        `result_types` accepts entries from the set `waec`, `neco`, `gce`, `nabteb`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sittings_count
                - result_types
              properties:
                sittings_count:
                  type: integer
                  enum:
                    - 1
                    - 2
                result_types:
                  type: array
                  items:
                    type: string
                    enum:
                      - waec
                      - neco
                      - gce
                      - nabteb
                  minItems: 1
      responses:
        '200':
          description: Updated registration row
        '404':
          description: No registration found for current user
        '422':
          description: Validation error
  /registration/me/claim-code:
    post:
      tags:
        - Registration — student
      summary: Bind institution code to authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - institution_issued_code
              properties:
                institution_issued_code:
                  type: string
      responses:
        '200':
          description: OK
        '409':
          description: Code already claimed
        '410':
          description: |
            Code expired. Body includes structured detail:
            `{ success: false, message, details: { error_code: "code_expired", expires_at } }`.
  /registration/me/code-status:
    get:
      tags:
        - Registration — student
      summary: Validate an institution code without claiming it
      description: |
        Read-only probe driving the figma 6-cell code wizard. Returns whether the code
        is claimable, plus the candidate's institution name.
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Status + structured error_code on failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                      university_name:
                        type: string
                        nullable: true
                      university:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          jupeb_prefix:
                            type: string
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      error_code:
                        type: string
                        enum:
                          - code_required
                          - code_not_found
                          - code_expired
                          - code_already_used
                        description: Present only when valid is false.
  /registration/me/confirm-subjects:
    post:
      tags:
        - Registration — student
      summary: Confirm subject combination (optional body to change combo while allowed)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_combination_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
  /registration/me/current:
    get:
      tags:
        - Registration — student
      summary: Current registration summary
      description: |
        Returns the candidate's current registration. Embeds:
        - `nin_verification: { id, status } | null`
        - `subject_combination: { id, code, title }`
        - `university: { id, name, jupeb_prefix }`
        - `session: { id, academic_year, year_short }`
        - `sittings_count`, `result_types`
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
  /registration/me/dashboard-access:
    get:
      tags:
        - Registration — student
      summary: Locked / unlocked dashboard state
      security:
        - BearerAuth: []
      responses:
        '200':
          description: OK
  /registration/me/profile:
    get:
      tags:
        - Registration — student
      summary: Composite profile read for the wizard / Profile screen
      description: |
        Single-call composite joining users + profiles + nin_verifications + the
        candidate's registration + subject combination + university + session.
        When the linked NIN verification is `pending`, NIN-derived fields fall back to
        the cached `intake_payload` so the student never re-types their info.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Composite payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      candidate:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          full_name:
                            type: string
                            nullable: true
                          provisional_candidate_code:
                            type: string
                            nullable: true
                          jupeb_candidate_number:
                            type: string
                            nullable: true
                          status:
                            type: string
                          photo_url:
                            type: string
                            nullable: true
                      basic_information:
                        type: object
                        properties:
                          date_of_birth:
                            type: string
                            format: date
                            nullable: true
                          gender:
                            type: string
                            nullable: true
                          residential_address:
                            type: string
                            nullable: true
                          state_of_origin:
                            type: string
                            nullable: true
                          lga:
                            type: string
                            nullable: true
                          place_of_birth:
                            type: string
                            nullable: true
                      contact_information:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                            nullable: true
                          phone:
                            type: string
                            nullable: true
                      next_of_kin:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                          relationship:
                            type: string
                          contact:
                            type: string
                      subject_combination:
                        type: object
                      university:
                        type: object
                      session:
                        type: object
                      nin_verification:
                        type: object
                        nullable: true
    patch:
      tags:
        - Registration — student
      summary: Patch editable candidate profile fields (bio-data, contact, next-of-kin)
      description: |
        Allows student to update editable profile fields during onboarding and before final submission.
        NIN-derived fields (name, date_of_birth, gender) are immutable when a verified NIN is attached.
        Accepts residential_address, state_of_origin, lga, place_of_birth, phone, email, and next_of_kin.
        Returns the updated composite profile (same shape as GET).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                residential_address:
                  type: string
                state_of_origin:
                  type: string
                lga:
                  type: string
                place_of_birth:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                  format: email
                next_of_kin:
                  type: object
                  properties:
                    name:
                      type: string
                    relationship:
                      type: string
                      enum: [mother, father, parent, guardian, spouse, sibling, child, relative, friend, other]
                    phone:

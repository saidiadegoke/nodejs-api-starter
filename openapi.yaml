        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
        subject_combination:
          $ref: '#/components/schemas/SubjectCombinationRef'
        biometric_captured:
          type: boolean

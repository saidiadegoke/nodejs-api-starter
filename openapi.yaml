                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 117
                          slices:
                            type: array
                            items:
                              type: object
                              properties:
                                type:
                                  type: string
                                  enum:
                                    - federal
                                    - state
                                    - private
                                    - unspecified
                                count:
                                  type: integer
                                pct:
                                  type: number
                                  format: float

  /sessions:
    get:
      tags:
        - Sessions
      summary: List sessions (paginated, with text search)
      description: |
        Paginated list. `q` is a case-insensitive ILIKE substring match
        across `academic_year` and `year_short` — powers the search
        box on the Session History tab.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          description: Case-insensitive substring match across academic_year / year_short.
          schema:
            type: string
            example: 2025/
      responses:
        '200':
          description: Paginated `Session` rows
        '401':
          description: Unauthorized
    post:
      tags:
        - Sessions
      summary: Create session (open)
      description: |
        New sessions are created with `status='open'`. Creating a new session
        closes any previously open session so there is only one active session.
        Cutoff dates are validated to be in chronological order:
        `closes_at ≤ candidate_info_cutoff_at ≤ profile_update_cutoff_at ≤ ca_cutoff_at`.
        `description` is accepted as an alias for `notes`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - academic_year
                - year_short
                - opens_at
                - closes_at
              properties:
                academic_year:
                  type: string
                  example: 2026/2027
                year_short:
                  type: string
                  example: '27'
                opens_at:
                  type: string
                  format: date-time
                closes_at:
                  type: string
                  format: date-time
                student_submission_deadline:
                  type: string
                  format: date-time
                institution_approval_deadline:
                  type: string
                  format: date-time
                candidate_info_cutoff_at:
                  type: string
                  format: date-time
                profile_update_cutoff_at:
                  type: string
                  format: date-time
                ca_cutoff_at:
                  type: string
                  format: date-time
                max_ca_score:
                  type: integer
                  minimum: 0
                  maximum: 100
                affiliation_fee_existing:
                  type: number
                  minimum: 0
                affiliation_fee_new:
                  type: number
                  minimum: 0
                exam_fee_per_candidate:
                  type: number
                  minimum: 0
                registration_fee_amount:
                  type: number
                  minimum: 0
                registration_fee_currency:
                  type: string
                  default: NGN
                  minLength: 3
                  maxLength: 3
                notes:
                  type: string
                description:
                  type: string
                  description: Alias for `notes`.
      responses:
        '201':
          description: Created `Session`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '409':
          description: Duplicate academic_year
        '422':
          description: Validation error (cutoff order
          max_ca_score range: null
          etc.): null
  /sessions/context:
    get:
      tags:
        - Sessions
      summary: Active, viewing, and effective session context
      description: |
        Returns three session concepts for the authenticated user:
        `active_session` is the global `status=open` session;
        `viewing_session` is the per-user read preference (or null);
        `effective_session` is what read APIs use when `session_id` is omitted
        (`viewing_session ?? active_session`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session context
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionContext'
        '401':
          description: Unauthorized
  /sessions/export:
    get:
      tags:
        - Sessions
      summary: Export sessions as CSV
      description: |
        Streams a CSV with columns `id, academic_year, year_short, status, opens_at,
        closes_at, candidate_info_cutoff_at, profile_update_cutoff_at, ca_cutoff_at,
        max_ca_score, affiliation_fee_existing, affiliation_fee_new,
        exam_fee_per_candidate, registration_fee_amount, registration_fee_currency,
        created_at`. Admin/registrar/super_admin only.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: Forbidden
  /sessions/finalize-all-closed:
    post:
      tags:
        - Sessions
      summary: Bulk finalize across every closed session
      description: |
        Walks every session with `status='closed'` that still has
        approved registrations awaiting matric assignment and runs
        `finalize-candidate-numbers` against each. Per-session
        failures are captured (`error` field in the result) without
        aborting the bulk run.

        **Auth:** admin / super_admin / registrar.

        **Optimization:** the endpoint only walks sessions with
        eligible rows — a clean DB returns in milliseconds.

        **Idempotency:** safe to re-run. The second invocation
        reports `totals.assigned: 0` because per-row updates use
        `setCandidateNumberIfNull`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Aggregated bulk-finalize result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          type: object
                          properties:
                            session_id:
                              type: string
                              format: uuid
                            academic_year:
                              type: string
                            year_short:
                              type: string
                            assigned:
                              type: integer
                            skipped:
                              type: integer
                            error:
                              type: string
                              description: Present only when finalize failed for this row.
                      totals:
                        type: object
                        properties:
                          sessions_processed:
                            type: integer
                          sessions_touched:
                            type: integer
                          assigned:
                            type: integer
                          skipped:
                            type: integer
        '401':
          description: Unauthenticated
        '403':
          description: Wrong role
  /sessions/metrics:
    get:
      tags:
        - Sessions
      summary: Session History KPI cards (effective session)
      description: |
        Returns the five header metrics on the Session History page for the
        caller's **effective** viewing session. Omit `session_id` to use the
        per-user Switch preference (or global open session). Pass `session_id`
        for a one-off override.
      security:
        - BearerAuth: []
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
            format: uuid
          description: Optional override; otherwise uses effective viewing session.
        - name: previous_session_id
          in: query
          schema:
            type: string
            format: uuid
          description: When set, response includes `compared_to` and per-metric `deltas`.
      responses:
        '200':
          description: Session-scoped KPI cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SessionMetricsResponse'
        '401':
          description: Unauthorized
        '404':
          description: Session not found (explicit session_id)
        '422':
          description: Invalid UUID

    patch:
      tags:
        - Sessions
      summary: Lock or unlock institution registration for a session
      description: |
        Toggles whether institutions can enroll/issue new candidate codes for
        this session. This is independent of the session `open` / `closed`
        lifecycle; an open session can still have registration locked.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - locked
              properties:
                locked:
                  type: boolean
      responses:
        '200':
          description: Updated session
        '422':
          description: locked must be boolean

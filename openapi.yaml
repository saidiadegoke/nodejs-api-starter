                            nullable: true
                          state_of_origin:
                            type: string
                            nullable: true
                          lga:
                            type: string
                            nullable: true
                          place_of_birth:
                            type: string
                            nullable: true
                      next_of_kin:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                            nullable: true
                          relationship:
                            type: string
                            nullable: true
                          phone:
                            type: string
                            nullable: true

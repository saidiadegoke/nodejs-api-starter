          description: Case-insensitive substring match across code / name / short_name.
          schema:
            type: string
            example: UNILAG
        - name: session_id
          in: query
          description: |
            Optional session override. When omitted, enrolled_count uses the caller's effective session (viewing preference, else the open session).
          schema:
            type: string

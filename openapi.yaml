          description: Unauthorized
    post:
      tags:
        - Catalog — admin
      summary: Create university
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
                - jupeb_prefix
                - email
              properties:
                code:
                  type: string
                name:
                  type: string
                short_name:
                  type: string
                jupeb_prefix:
                  type: string
                  description: Exactly three digits (e.g. `001`).
                university_type:
                  type: string
                  enum:
                    - federal
                    - state
                    - private
                email:
                  type: string
                  format: email
                  description: |
                    Institution contact email and `institution_admin` login. A password is
                    generated and emailed (not returned in the API response).
                address:
                  type: string
                phone:
                  type: string
                expected_candidate_count:
                  type: integer
                  minimum: 0
                description:
                  type: string
                metadata:
                  type: object
                admin_first_name:
                  type: string
                  description: Optional admin profile name (updatable later).
                admin_last_name:
                  type: string
                  description: Optional admin profile name (updatable later).
      responses:
        '201':
          description: |
            Created — response data is the `University` row plus `institution_admin`
            (login uses `email`; password sent by email).
        '401':
          description: Unauthorized
        '409':
          description: Duplicate university code/prefix, or login email already registered
        '422':
          description: Validation error (incl. malformed email
          negative capacity): null
  /catalog/universities/bulk:
    post:
      tags:
        - Catalog — admin
      summary: Bulk-create universities from CSV
      description: |
        CSV header columns supported: `code,name,jupeb_prefix,short_name,university_type,
        email,address,phone,expected_candidate_count,description`.

        **Three payload shapes accepted** — pick whichever is convenient
        for the client. The csv-upload middleware normalizes them all
        onto `req.csvText`:

        1. **`multipart/form-data`** — attach a file. Field name `file`
           (default) or `csv` — both work. This is the shape frontend
           file pickers send by default.
        2. **`text/csv`** — raw CSV string in the request body.
        3. **`application/json`** — `{ "csv": "<csv text>" }`.

        Per-row validation; failures are reported in `outcomes[]` rather
        than aborting the batch. Max 1000 rows.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to ingest (field name flexible — `file` or `csv`).
          text/csv:
            schema:
              type: string
              description: Raw CSV body.
          application/json:
            schema:
              type: object
              required:
                - csv
              properties:
                csv:
                  type: string
                  description: CSV body inline.
      responses:
        '200':
          description: Per-row outcome summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BulkResult'
        '413':
          description: Too many rows

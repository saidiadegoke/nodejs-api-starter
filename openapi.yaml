                last_name:
                  type: string
            example:
              email: jane@example.com
              phone: '+2348012345678'
              password: SecurePass123!
              first_name: Jane
              last_name: Doe
      responses:
        '201':
          description: Registration successful
        '400':
          description: Validation error
        '409':
          description: User already exists
  /auth/register-with-code:
    post:
      summary: Claim a JUPEB institution code and create the student account
      description: |
        Single-shot signup paired with `GET /auth/code-status`. Once the
        client has pre-validated that a code is claimable, it posts the
        code + password here to:

        1. Mint the user account.
        2. Bind it to the matching `jupeb_registrations` row.
        3. Issue access + refresh tokens — the response is the same
           envelope as `/auth/login`, so the mobile app can transition
           straight into the authenticated wizard (typically
           `GET /jupeb/me/profile`).

        The contact / name fields are optional overlays on the
        institution-pre-seeded values. A `jupeb-welcome-student.html`
        email fires fire-and-forget on success.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - password
              properties:
                code:
                  type: string
                  description: The institution-issued code.
                password:
                  type: string
                  minLength: 8
                email:
                  type: string
                  format: email
                phone:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
            example:
              code: F7K2P9
              password: SecurePass123!
              email: candidate@example.com
              phone: '+2348000000000'
              first_name: Adebayo
              last_name: Salami
      responses:
        '201':
          description: Account created and code claimed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            nullable: true
                            format: email
                          phone:
                            type: string
                            nullable: true
                          first_name:
                            type: string
                            nullable: true
                          last_name:
                            type: string
                            nullable: true
                          role:
                            type: string
                          roles:
                            type: array
                            items:
                              type: string
                      registration:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          status:
                            type: string
                            example: claimed
                          provisional_candidate_code:
                            type: string
                          claimed_at:
                            type: string
                            format: date-time
        '400':
          description: |
            Validation / claim failure. `details.error_code` distinguishes
            the cases: `code_required`, `code_invalid`.
        '409':
          description: |
            `code_already_claimed` — the code has already been used to
            create an account. Client should switch to the **Log in** UI
            (the `account` block on `GET /auth/code-status` carries the
            masked identifier to prefill).
        '410':
          description: '`code_expired` — the code is past its expiry.'
        '422':
          description: '`password_too_short` (or other field validation).'
  /auth/resend-otp:
    post:
      summary: Issue and dispatch a fresh 6-digit OTP
      description: |
        Generates a cryptographically strong 6-digit code, stores only
        its sha256 hash in `otp_codes`, and dispatches via the resolved
        channel (fire-and-forget — SMTP / SMS RTT does not gate the HTTP
        response).

        **Channel resolution** (priority order):
        1. request body `channel` (`email` | `sms` | `both`)
        2. env `OTP_CHANNEL`
        3. default `email`

        **Account-enumeration safe.** Unknown identifiers still return
        `200 OK` with the same shape and a masked recipient so an attacker
        can't tell whether an account exists.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  description: Email or phone of the user. Accepts `email` or `phone` as aliases.
                email:
                  type: string
                phone:
                  type: string
                channel:
                  type: string
                  enum:
                    - email
                    - sms
                    - both
                  description: Optional override for the OTP_CHANNEL env.
            example:
              identifier: ada@example.com
              channel: email
      responses:
        '200':
          description: OTP queued. The actual delivery happens asynchronously.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent:
                        type: boolean
                      channels:
                        type: array
                        items:
                          type: string
                          enum:
                            - email
                            - sms
                      expires_at:
                        type: string
                        format: date-time
                      masked_recipient:
                        type: string
                        description: |
                          `xx***@domain` for emails, `+234xxx***NN` for phones.
                          Same shape whether or not the account actually exists.
  /auth/resend-verification:
    post:
      summary: Re-issue a verification link (alt template)
      description: |
        Same mechanics as `/auth/send-verification` but uses the
        `resend-verification.html` template (different copy).
      tags:
        - Auth
      responses:
        '200':
          description: Verification email queued
        '401':
          description: Unauthenticated
  /auth/reset-password:
    post:
      summary: Reset password with a token
      tags:

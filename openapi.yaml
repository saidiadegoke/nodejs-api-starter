    patch:
      tags:
        - Registration — institution
      summary: Update subject combination before student confirms
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subject_combination_id
              properties:
                subject_combination_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OK
    delete:
      tags:
        - Registration — institution
      summary: Delete registration row (hard delete)
      description: |
        Permanently removes the `jupeb_registrations` row for this id. Allowed only when the row is
        **`rejected`**, **`withdrawn`**, or **`code_issued`** with **no linked student** (`user_id` is null —
        unused institution code). Child rows with `ON DELETE CASCADE` are removed; other references may
        be nullified per schema.

        Does **not** delete an institution or university — only this enrollment row.

                        format: uuid
                      session_id:
                        type: string
                        format: uuid
                        nullable: true
                      university_id:
                        type: string
                        format: uuid
                        nullable: true
                      subject_combination_id:
                        type: string
                        format: uuid
                        nullable: true
                      status:
                        type: string
                      status_reason:
                        type: string
                        nullable: true
                      institution_issued_code:
                        type: string
                        nullable: true
                      institution_code_expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      provisional_candidate_code:
                        type: string
                        nullable: true
                      jupeb_candidate_number:
                        type: string
                        nullable: true
                      claimed_at:
                        type: string
                        format: date-time
                        nullable: true
                      submitted_at:
                        type: string
                        format: date-time
                        nullable: true
                      approved_at:
                        type: string
                        format: date-time
                        nullable: true
                      approved_by:
                        type: string
                        format: uuid
                        nullable: true
                      dashboard_unlocked_at:
                        type: string
                        format: date-time
                        nullable: true
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                      nin_verification_id:
                        type: string
                        format: uuid
                        nullable: true
                      nin_verification:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            format: uuid
                          status:
                            type: string
                      university:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          jupeb_prefix:
                            type: string
                      subject_combination:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          code:
                            type: string
                          title:
                            type: string
                      session:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          academic_year:
                            type: string
                          year_short:
                            type: string
                      candidate:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          phone:
                            type: string
                            nullable: true
                          email_verified:

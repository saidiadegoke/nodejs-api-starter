          nullable: true
          properties:
            session_id:
              type: string
              format: uuid
            label:
              type: string
        deltas:
          type: object
          nullable: true
          additionalProperties:
            $ref: '#/components/schemas/SessionStatsDelta'
    NinVerifySubjectCombination:
      type: object
      nullable: true
      description: |
        Returned when `intake_payload.subject_combination_id` matches an **active** catalog row
        (8-4-4-4-12 hex id, as accepted by PostgreSQL — not limited to strict RFC variant/version nibbles).
        Same composite shape as institution registration list (`code`, `title`, timestamps,
        `subject_items[]`, etc.). Omitted when the id is missing, malformed, or the combo is inactive.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        status:
          type: string
        is_global:
          type: boolean
        university_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        subject_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              position:
                type: integer
              subject_id:
                type: string
                format: uuid
              code:
                type: string
              name:
                type: string
    UniversitySummary:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: University of Lagos
        code:
          type: string
          example: UNILAG
        status:
          type: string
          enum:
            - active
            - inactive
    SessionSummary:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: 2026/2027
          description: jupeb_registration_sessions.academic_year
        status:
          type: string
          enum:
            - open
            - closed
    StatCard:
      type: object
      properties:
        value:
          type: integer
          example: 2318
        delta_pct:
          type: number
          nullable: true
          description: |
            Percent change vs the chronologically-prior session. `null` when there is no prior session
            or the prior count was zero (and current is non-zero).
          example: 6.08
    TrendPoint:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        count:
          type: integer
    TrendSeries:
      type: object
      properties:
        key:
          type: string
          enum:
            - current
            - previous
        year:
          type: integer
        points:
          type: array
          minItems: 12
          maxItems: 12
          items:
            $ref: '#/components/schemas/TrendPoint'
    SubjectEnrollmentRow:
      type: object

        status:
          type: string
          enum:
            - approved
            - pending
            - rejected
            - withdrawn
          description: Bucketed status (see top of doc).
        raw_status:
          type: string
          enum:
            - provisional
            - code_issued
            - claimed
            - pending_student_confirm
            - pending_documents
            - pending_institution_review
            - approved
            - rejected
            - withdrawn
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data: {}
    JupebUniversityScopeRow:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        jupeb_university_id:
          type: string
          format: uuid
          nullable: true
    PatchJupebUniversityBody:

                        type: object
                        nullable: true
                      subject_combination:
                        type: object
                      university:
                        type: object
                      session:
                        type: object
                      nin_verification:
                        type: object
                        nullable: true
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            requirement_id:
                              type: string
                              format: uuid
                            status:
                              type: string
                            file_id:
                              type: string
                              format: uuid
                              nullable: true
                            download_url:
                              type: string
                              nullable: true
                            created_at:
                              type: string
                              format: date-time
                      biometrics:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            capture_type:
                              type: string
                              enum:
                                - face
                                - fingerprint
                            quality_score:
                              type: number
                              nullable: true
                            captured_at:
                              type: string
                              format: date-time
                      biometric_status:
                        type: string
                        enum:
                          - none
                          - partial
                          - complete

              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicket'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
  /support/tickets:
    post:

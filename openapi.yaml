      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                events:
                  type: array
                  items:
                    type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Webhook updated
        '404':
          description: Not found
    delete:
      summary: Delete a webhook
      tags:
        - Webhooks
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Webhook deleted
        '404':
          description: Not found
  /websocket/stats:
    get:
      summary: Get WebSocket connection statistics (admin only)
      tags:
        - WebSocket
      responses:
        '200':
          description: Stats payload with connectedUsers and totalConnections
        '403':
          description: Admin access required
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT access token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key authentication
  schemas:
    University:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        short_name:
          type: string
          nullable: true
        jupeb_prefix:
          type: string
          description: Three numeric digits, e.g. "001"
        status:
          type: string
          enum:
            - active
            - inactive
        university_type:
          type: string
          enum:
            - federal
            - state
            - private
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        expected_candidate_count:
          type: integer
          nullable: true
          minimum: 0
        description:
          type: string
          nullable: true
        metadata:
          type: object
        enrolled_count:
          type: integer
          minimum: 0
          description: |
            Non-withdrawn candidate registrations for this university, scoped to the effective session (admin list only).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Subject:
      type: object
      required:
        - name
        - grade
      properties:
        name:
          type: string
          example: ENGLISH LANGUAGE
        code:
          type: string
          nullable: true
          example: '001'
        grade:
          type: string
          example: B3
          description: |
            Grade exactly as printed on the certificate. For
            WAEC / NECO / NABTEB this is one of `A1`, `B2`, `B3`, `C4`,
            `C5`, `C6`, `D7`, `E8`, `F9`. For GCE A-Level it is one of
            `A`, `B`, `C`, `D`, `E`, `U`. WAEC GCE (O-Level) uses the
            same `A1..F9` scheme as WAEC SSCE.
        grade_normalized:
          type: string
          nullable: true
          enum:
            - A
            - B
            - C
            - D
            - E
            - F
            - null
          example: B
          description: |
            A–F collapse of `grade` for downstream scoring (academic module
            uses this for the `+1` / `0` rule). Mapping:
            `A1→A`, `B2|B3→B`, `C4|C5|C6→C`, `D7→D`, `E8→E`, `F9→F`,
            GCE `U→F`. `null` when the raw grade could not be recognized.
        score:
          type: number
          nullable: true
          description: Numeric score where present (NECO, GCE)
    SubjectCombinationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        subject_id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    SubjectCombination:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        is_global:
          type: boolean
        university_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - active
            - inactive
        subject_items:
          type: array
          items:
            $ref: '#/components/schemas/SubjectCombinationItem'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    BulkResult:
      type: object
      properties:
        total:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        outcomes:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              ok:
                type: boolean
              data:
                type: object
                nullable: true
              error_code:
                type: string
                nullable: true
              error_message:
                type: string
                nullable: true
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        academic_year:
          type: string
          example: 2026/2027
        year_short:
          type: string
          example: '27'
        status:
          type: string
          enum:
            - open
            - closed
        registration_locked:
          type: boolean
          description: When true, institutions cannot enroll/issue new candidate codes.
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        student_submission_deadline:
          type: string
          format: date-time
          nullable: true
        institution_approval_deadline:
          type: string
          format: date-time
          nullable: true
        candidate_info_cutoff_at:
          type: string
          format: date-time
          nullable: true
        profile_update_cutoff_at:
          type: string
          format: date-time
          nullable: true
        ca_cutoff_at:
          type: string
          format: date-time
          nullable: true
        max_ca_score:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        affiliation_fee_existing:
          type: number
          nullable: true
          minimum: 0
        affiliation_fee_new:
          type: number
          nullable: true
          minimum: 0
        exam_fee_per_candidate:
          type: number
          nullable: true
          minimum: 0
        registration_fee_amount:
          type: number
          nullable: true
          minimum: 0
        registration_fee_currency:
          type: string
          example: NGN
        notes:
          type: string
          nullable: true
          description: Aliased as `description` on input.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SessionStatsDelta:
      type: object
      properties:
        value:
          type: number
        previous:
          type: number
        delta_pct:
          type: number
          nullable: true
          description: '`null` when previous is 0 and current is non-zero.'
        direction:
          type: string
          enum:
            - up
            - down
            - flat
    SessionStats:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        total_registrations:
          type: integer
        registrations_by_status:
          type: object
          additionalProperties:
            type: integer
        institutions_count:
          type: integer
        subject_combinations_count:
          type: integer
        candidates_with_biometrics:
          type: integer
        candidates_without_biometrics:
          type: integer
        previous_session_id:
          type: string
          format: uuid
          nullable: true
          description: Present when ?previous_session_id is supplied.
        deltas:
          type: object
          description: Present when ?previous_session_id is supplied.
          additionalProperties:
            $ref: '#/components/schemas/SessionStatsDelta'
    SessionContextSummary:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: 2026/2027
        status:
          type: string
          enum:
            - open
            - closed
        opens_at:
          type: string
          format: date-time
          nullable: true
        closes_at:
          type: string
          format: date-time
          nullable: true
    SessionContext:
      type: object
      properties:
        active_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: Global open session (null if none).
        viewing_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: User viewing preference (null when unset).
        effective_session:
          $ref: '#/components/schemas/SessionContextSummary'
          description: Resolved read scope when session_id is omitted.
    SessionMetrics:
      type: object
      properties:
        exams:
          type: integer
          nullable: true

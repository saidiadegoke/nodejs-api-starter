  /ocr/jobs:
    post:
      tags:
        - OCR
      summary: Create an OCR job
      description: |
        Submit a PDF or image for OCR. Provide **one** of:
        - `file` (multipart) — direct upload
        - `file_id` (JSON) — existing file in the `files` module
        - `data` + `filename` (JSON) — base64 payload

        Returns `202` with a `job_id` to poll, or `200` with the result when
        `wait=true` and processing completes within 30s.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                exam_type:
                  $ref: '#/components/schemas/ExamType'
                wait:
                  type: boolean
                  default: false
                context:
                  type: string
                metadata:
                  type: string
                  description: JSON-encoded object
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobJsonBody'
      responses:
        '200':
          description: Synchronous completion (wait=true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJob'
        '202':
          description: Job accepted; poll status via GET /ocr/jobs/{jobId}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJob'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported MIME
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - OCR
      summary: List OCR jobs
      description: |
        Owner-scoped by default. Staff with `ocr.read.any` see all jobs.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - queued
              - processing
              - completed
              - failed
        - in: query
          name: exam_type
          schema:
            $ref: '#/components/schemas/ExamType'
        - in: query
          name: file_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OcrJob'
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
  /ocr/jobs/{jobId}:
    get:
      tags:
        - OCR
      summary: Get an OCR job (status + result when complete)
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: OCR job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJob'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:

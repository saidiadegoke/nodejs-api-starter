          description: Unauthorized
        '403':
          description: Forbidden — role or institution scope
        '404':
          description: session_id not found
        '422':
          description: Invalid UUID
  /dashboard/session-timeline:
    get:
      tags:
        - JUPEB — dashboard
      summary: Registration Timeline card data
      description: |
        Powers the "Registration Open / Current Date / Registration
        Close" header card on the Registration Management screen.
        Without a `session_id`, resolves to the currently-open session
        (or the most recent one if none is open).

        `within_window: true` ⇔ `opens_at <= now <= closes_at`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionIdQuery'
      responses:
        '200':
          description: Timeline data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        nullable: true
                        type: object
                        properties:
                          session_id:
                            type: string
                            format: uuid
                          academic_year:
                            type: string
                            example: 2025/2026
                          year_short:
                            type: string
                            example: '26'
                          status:
                            type: string
                            enum:
                              - open
                              - closed
                          opens_at:
                            type: string
                            format: date-time
                            nullable: true
                          closes_at:
                            type: string
                            format: date-time
                            nullable: true
                          candidate_info_cutoff_at:
                            type: string
                            format: date-time
                            nullable: true
                          profile_update_cutoff_at:
                            type: string
                            format: date-time
                            nullable: true
                          ca_cutoff_at:
                            type: string
                            format: date-time
                            nullable: true
                          now:
                            type: string
                            format: date-time
                            description: Server clock at response time.
                          within_window:
                            type: boolean
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Invalid session_id
  /dashboard/stat-cards:
    get:
      tags:
        - JUPEB — dashboard
      summary: Top KPI cards (with deltas vs prior session)
      description: |
        Counts are scoped to the resolved (or supplied) session and institution. Deltas compare
        against the chronologically-prior session by `opens_at`.

        - `institutions_onboarded` is a count of active universities. There's no
          session-scoped notion of "prior institutions", so `delta_pct` is always `null` here.
        - `total_registered` counts every registration in scope (**including** `withdrawn`).
        - `pending` rolls up the six pending-bucket statuses (see top of doc).
        - `with_biometrics` counts non-withdrawn registrations that have at least one
          non-replaced biometric capture.
        - `without_biometrics` is the inverse: non-withdrawn registrations with NO active
          biometric capture.
        - `registration_locked` / `registration_lock.locked` indicates whether institutions
          can currently enroll/issue new candidate codes for the resolved session.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UniversityIdQuery'
        - $ref: '#/components/parameters/SessionIdQuery'
      responses:
        '200':
          description: KPI card values + deltas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          institutions_onboarded:
                            $ref: '#/components/schemas/StatCard'
                          total_registered:
                            $ref: '#/components/schemas/StatCard'
                          approved:
                            $ref: '#/components/schemas/StatCard'
                          pending:
                            $ref: '#/components/schemas/StatCard'
                          with_biometrics:
                            $ref: '#/components/schemas/StatCard'
                          without_biometrics:
                            $ref: '#/components/schemas/StatCard'
                          registration_locked:
                            type: boolean
                          registration_lock:
                            type: object
                            properties:
                              locked:
                                type: boolean
                              session_id:
                                type: string
                                format: uuid
                                nullable: true
                              label:
                                type: string
                                nullable: true
                          compared_to:
                            type: object
                            nullable: true
                            description: Prior session used for delta calculation, or null if none exists.
                            properties:
                              session_id:
                                type: string
                                format: uuid
                              label:
                                type: string
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Invalid UUID

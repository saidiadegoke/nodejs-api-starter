  /auth/code-status:
    get:
      summary: Pre-validate a JUPEB institution-issued code
      description: |
        Anonymous lookup the mobile app calls when the student types the
        code in. Tells the client whether the code is claimable, expired,
        unknown, or already-used. When already-used, the response
        carries an `account` block with masked identifiers so the
        client can route to a **Log in** screen with a prefilled
        identifier — no second round-trip needed.
      tags:
        - Auth
      security: []
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        description: true ⇔ the code can still be used to claim.
                      error_code:
                        type: string
                        nullable: true
                        enum:
                          - code_not_found
                          - code_expired
                          - code_already_claimed
                          - code_unavailable
                      expires_at:
                        type: string
                        format: date-time
                        nullable: true
                      university:
                        type: object
                        nullable: true
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          short_name:
                            type: string
                            nullable: true
                      account:
                        type: object
                        nullable: true
                        description: Present only when `error_code === 'code_already_claimed'`.
                        properties:
                          exists:
                            type: boolean
                          active:
                            type: boolean
                            description: true ⇔ `users.status === "active"`.
                          email_masked:
                            type: string
                            nullable: true
                            example: ad***@example.com
                          phone_masked:
                            type: string
                            nullable: true
                            example: +234803***5678
                          email_verified:
                            type: boolean
                          phone_verified:
                            type: boolean
                          can_login:
                            type: boolean
                            description: Hint for the client — `account.active` aliased for readability.
        '400':
          description: Missing or malformed code parameter

                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Admin message sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupportMessage'
  /support/categories:
    get:
      summary: Get allowed support categories
      description: Returns dropdown options for support categories matching the Figma UI spec.
      tags:
        - Support - Public
      responses:
        '200':
          description: List of support categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportCategory'
  /support/institution/stats:
    get:
      summary: Get institution support stats
      description: Returns overview metrics of open, in_progress, and resolved tickets for the university.
      tags:
        - Support - Institution
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Institution ticket statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                      open:
                        type: integer
                      in_progress:
                        type: integer
                      resolved:
                        type: integer
                      closed:
                        type: integer
                      by_category:
                        type: array
                        items:
                          type: object
  /support/institution/tickets:
    get:
      summary: List institution support tickets
      description: Lists tickets submitted by students enrolled in the institution staff's university.
      tags:
        - Support - Institution
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SupportStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/SupportCategory'
        - name: search
          in: query
          description: Search term matching ticket number, candidate name, or subject
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated institution tickets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupportTicket'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
  /support/institution/tickets/{ticketId}:
    get:
      summary: Get ticket detail for institution staff
      description: Returns ticket information, candidate profile details, and conversation thread. Must belong to the staff's university.
      tags:
        - Support - Institution
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ticket detail with conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupportTicketDetail'
        '403':
          description: Forbidden - ticket belongs to another university
        '404':
          description: Ticket not found
  /support/institution/tickets/{ticketId}/reply:
    post:
      summary: Reply to ticket as institution staff
      description: Staff posts a response into the conversation thread. Sends email notification to the candidate and transitions open tickets to in_progress.
      tags:
        - Support - Institution
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  example: We have updated your records.
                attachments:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Reply posted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SupportMessage'
  /support/institution/tickets/{ticketId}/status:
    patch:
      summary: Update ticket status as institution staff
      description: Staff updates ticket status (in_progress, resolved, closed) and supplies resolution notes.
      tags:
        - Support - Institution
      security:
        - BearerAuth: []
      parameters:
        - name: ticketId

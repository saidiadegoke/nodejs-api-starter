  /auth/login:
    post:
      summary: Log in with email / phone / reg-number / matric and password
      description: |
        Accepts **four** identifier shapes on the same `identifier` field:

        - email (case-insensitive)
        - phone (E.164)
        - `jupeb_registrations.provisional_candidate_code` (interim 9-digit reg no.)
        - `jupeb_registrations.jupeb_candidate_number` (final matric — alphanumeric
          with `/`, `-`, `_` accepted)

        **Matric lockdown.** Once a candidate has a `jupeb_candidate_number`
        assigned to any of their registrations, email / phone / reg-code stop
        resolving to them — only matric works. Admins / registrars /
        institution_admins bypass the lockdown.

        **Re-entry exception.** The lockdown is automatically released
        while the candidate has an in-progress registration without a
        matric yet (status code_issued / claimed / pending_*). This
        re-opens email / phone / code login when a returning student
        picks up a fresh code in a new session.

        **Response carries a `registration` block** when the user has any
        JUPEB registration, including a `next_step` hint the mobile client
        can route on without a follow-up call. When the student has rows
        in multiple sessions, the embedded `registration` is the one in
        the currently-open session (falling back to the most recently
        updated row if no open session matches).
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  description: |
                    Email, phone, provisional reg number, or final matric.
                password:
                  type: string
            example:
              identifier: UI/2024/12345
              password: SecurePass123!
      responses:
        '200':
          description: Login successful — returns access/refresh tokens + registration summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      token_type:
                        type: string
                        example: Bearer
                      expires_in:
                        type: integer
                        example: 3600
                      user:
                        type: object
                        properties:
                          user_id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          phone:
                            type: string
                            nullable: true
                          first_name:
                            type: string
                            nullable: true
                          last_name:
                            type: string
                            nullable: true
                          role:
                            type: string
                            nullable: true
                          roles:
                            type: array
                            items:
                              type: string
                          verified:
                            type: boolean
                      registration:
                        nullable: true
                        type: object
                        description: |
                          Latest JUPEB registration for the user. `null` when
                          the user has none (admins, etc.).
                        properties:
                          id:
                            type: string
                            format: uuid
                          status:
                            type: string
                            enum:
                              - provisional
                              - code_issued
                              - claimed
                              - pending_student_confirm
                              - pending_documents
                              - pending_institution_review
                              - approved
                              - rejected
                              - withdrawn
                          provisional_candidate_code:
                            type: string
                            nullable: true
                          jupeb_candidate_number:
                            type: string
                            nullable: true
                          claimed_at:
                            type: string
                            format: date-time
                            nullable: true
                          submitted_at:
                            type: string
                            format: date-time
                            nullable: true
                          approved_at:
                            type: string
                            format: date-time
                            nullable: true
                          dashboard_unlocked:
                            type: boolean
                          next_step:
                            type: string
                            description: Client-side route hint derived from `status`.
                            enum:
                              - claim_code
                              - confirm_subjects
                              - upload_documents
                              - await_review
                              - view_dashboard
                              - view_rejection
                              - restart
                            nullable: true
        '401':
          description: Invalid credentials

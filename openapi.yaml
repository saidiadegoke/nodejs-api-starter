  /ocr/jobs/{jobId}/bind-requirement:
    post:
      tags:
        - OCR
      summary: Bind a completed OCR result to a submission requirement
      description: |
        Records the linkage between an OCR result and a JUPEB submission
        requirement so the `submission` / `academic` modules can pre-fill
        candidate grades. Requires `ocr.requirement.bind` or ownership of the
        registration.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - registration_id
                - requirement_id
              properties:
                registration_id:
                  type: string
                  format: uuid
                requirement_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Bound
        '403':
          description: Forbidden
        '404':
          description: Job
          registration: null
          or requirement not found: null
        '409':
          description: Job is not completed
  /ocr/jobs/{jobId}/retry:
    post:
      tags:
        - OCR
      summary: Re-run a failed job
      description: |
        Allowed only when the source job's `status` is `failed`. Creates a

    ExamType:
      type: string
      enum:
        - auto
        - waec
        - neco
        - nabteb
        - gce
        - generic
    Candidate:
      type: object
      properties:
        name:
          type: string
          example: ADEGOKE RASHEED OLUWASEUN
        exam_number:
          type: string
          example: '4250101234'
        centre_number:
          type: string
          nullable: true
        centre_name:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
    OcrResult:
      type: object
      required:
        - exam_type
        - candidate
        - subjects
        - confidence
      properties:
        exam_type:
          $ref: '#/components/schemas/ExamType'
        exam_body:
          type: string
          example: WEST AFRICAN EXAMINATIONS COUNCIL
        exam_year:
          type: integer
          example: 2023
        exam_diet:
          type: string
          nullable: true
          enum:
            - May/June
            - November/December
            - Private
            - null

  /sessions/{sessionId}/finalize-candidate-numbers:
    post:
      tags:
        - Sessions
      summary: Assign final JUPEB candidate numbers (session must be closed)
      description: |
        Idempotent batch update for approved registrations without
        `jupeb_candidate_number`. See also JUPEB 005 and
        `GET /registration/sessions/{sessionId}/numbering-preview`.

        **Side effect:** for every row a matric is assigned to, a
        `jupeb-matric-assigned.html` email is dispatched to the
        candidate (fire-and-forget). The email's subject embeds the
        new matric, and the body restates the matric-lockdown rule so
        students aren't surprised when their email / phone / reg-code
        login stops working.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: |
            Response data includes `session_id`, `assigned`, `skipped`, `numbers[]`.
        '422':
          description: Session not closed
